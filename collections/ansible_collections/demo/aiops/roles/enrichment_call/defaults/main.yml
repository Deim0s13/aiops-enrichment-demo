---
# Calls the enrichment service (design 5.3) and checks its answer before anything reaches ServiceNow.
# The address, token and CA bundle come from the job's credential, as ENRICHMENT_URL,
# ENRICHMENT_TOKEN and ENRICHMENT_CA_FILE.
enrichment_call_revision: 1
enrichment_call_evidence: []
# The order an engineer reads evidence in: what happened to the service, the numbers, what it logged,
# then what changed. Items with other prefixes follow, by ID.
enrichment_call_evidence_order: [EV-POD, EV-MET, EV-LOG, EV-CHG]
enrichment_call_catalogue: []
# The affected service's running version, from the diagnostics; retrieval is filtered on it.
enrichment_call_service_version: ""
enrichment_call_timeout: 90

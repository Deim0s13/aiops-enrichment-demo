---
- name: Ask the enrichment service
  ansible.builtin.uri:
    url: "{{ lookup('ansible.builtin.env', 'ENRICHMENT_URL') }}/v1/enrich"
    method: POST
    headers:
      Authorization: "Bearer {{ lookup('ansible.builtin.env', 'ENRICHMENT_TOKEN') }}"
    ca_path: "{{ lookup('ansible.builtin.env', 'ENRICHMENT_CA_FILE') }}"
    body_format: json
    body:
      incident: "{{ enrichment_call_incident }}"
      revision: "{{ enrichment_call_revision }}"
      evidence: "{{ enrichment_call_evidence }}"
      catalogue: "{{ enrichment_call_catalogue }}"
    timeout: "{{ enrichment_call_timeout }}"
    # Every answer is accepted here and judged below: the call carries the token, so a failure here
    # would be censored, and the operator would not see why.
    status_code: [-1, 200, 400, 401, 403, 404, 413, 422, 429, 500, 502, 503, 504]
  register: enrichment_call_response
  no_log: true

# The service's own explanation holds no secrets: for a 422, which field broke the contract and why.
- name: Stop if the service did not answer, or refused the request
  ansible.builtin.assert:
    that: enrichment_call_response.status == 200
    fail_msg: >-
      The enrichment service answered
      {{ ('HTTP ' ~ enrichment_call_response.status) if enrichment_call_response.status > 0 else 'nothing' }}:
      {% if enrichment_call_response.json.detail is defined and enrichment_call_response.json.detail is not string %}
      {{ enrichment_call_response.json.detail[:5] | map(attribute='loc') | map('join', '.')
         | zip(enrichment_call_response.json.detail[:5] | map(attribute='msg')) | map('join', ': ') | join('; ') }}
      {% else %}
      {{ (enrichment_call_response.json.detail | default(enrichment_call_response.msg | default('no detail'))) | string | truncate(300) }}
      {% endif %}
    quiet: true

- name: Keep only the answer
  ansible.builtin.set_fact:
    enrichment_call_answer: "{{ enrichment_call_response.json }}"

# Design 5.3, rules 3 to 5: the shape, the citations and the catalogue. A failure here takes the
# workflow's failure branch; nothing unchecked reaches the incident.
- name: Check the answer before it is written
  ansible.builtin.assert:
    that:
      - enrichment_call_answer.status in ['enriched', 'insufficient_evidence']
      - >-
        ['gaps', 'likely_causes', 'manual_review_required', 'next_steps', 'provenance', 'recommended_job', 'summary']
        | difference(enrichment_call_answer.keys() | list) | length == 0
      - enrichment_call_answer.likely_causes | rejectattr('citations', 'truthy') | list | length == 0
      - enrichment_call_answer.next_steps | rejectattr('citations', 'truthy') | list | length == 0
      - >-
        enrichment_call_answer.recommended_job is none
        or enrichment_call_answer.recommended_job.job_id | default('') in enrichment_call_catalogue | map(attribute='id') | list
    fail_msg: The enrichment service's answer does not follow design 5.3, so it is not written to the incident.
    quiet: true

- name: Write the work note text and the state
  ansible.builtin.set_fact:
    enrichment_call_note: "{{ lookup('ansible.builtin.template', 'note.j2') | trim }}"
    enrichment_call_state: "{{ 'complete' if enrichment_call_answer.status == 'enriched' else 'insufficient_evidence' }}"

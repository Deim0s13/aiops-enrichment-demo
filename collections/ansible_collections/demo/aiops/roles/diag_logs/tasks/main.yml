---
- name: Find the service's newest pod
  ansible.builtin.uri:
    url: "{{ evidence_api }}/api/v1/namespaces/{{ evidence_target.namespace }}/pods?labelSelector={{ ('app=' ~ evidence_target.app) | urlencode }}"
    headers:
      Authorization: "Bearer {{ evidence_token }}"
    ca_path: "{{ evidence_ca_file | default(omit, true) }}"
    timeout: "{{ evidence_call_timeout }}"
    status_code: [200, 401, 403, 404]
  register: diag_logs_pods
  no_log: true

- name: Stop if the cluster refused
  ansible.builtin.assert:
    that: diag_logs_pods.status == 200
    fail_msg: "The cluster answered HTTP {{ diag_logs_pods.status }} when listing pods in {{ evidence_target.namespace }}."
    quiet: true

- name: Keep only the newest pod's name
  ansible.builtin.set_fact:
    diag_logs_pod: >-
      {{ diag_logs_pods.json['items'] | sort(attribute='metadata.creationTimestamp') | map(attribute='metadata.name') | last | default('') }}

# The previous container's log is the one that ended, if it restarted. Without a restart there is
# none (HTTP 400), so the current log is read as well and used instead.
- name: Read the container's log
  ansible.builtin.uri:
    url: >-
      {{ evidence_api }}/api/v1/namespaces/{{ evidence_target.namespace }}/pods/{{ diag_logs_pod }}/log?container={{ evidence_target.container
      }}&previous={{ item }}&tailLines={{ diag_logs_tail_lines }}&limitBytes={{ diag_logs_limit_bytes }}
    headers:
      Authorization: "Bearer {{ evidence_token }}"
    ca_path: "{{ evidence_ca_file | default(omit, true) }}"
    timeout: "{{ evidence_call_timeout }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404]
  loop: ["true", "false"]
  register: diag_logs_read
  when: diag_logs_pod | length > 0
  no_log: true

# Repeated messages are collapsed: lines that differ only in their numbers become one entry with a
# count, a time range and the first and last values, so the excerpt shows what the log says, not how
# often. A leading timestamp is taken off the message and kept for the time range.
- name: State what the log shows
  ansible.builtin.set_fact:
    evidence_items:
      - id: EV-LOG-01
        target: "{{ evidence_target.namespace }}/{{ diag_logs_pod or evidence_target.app }}"
        fact: >-
          {%- if not diag_logs_pod -%}
          No pod with label app={{ evidence_target.app }} is running, so there is no log to read.
          {%- elif diag_logs_used is none -%}
          The cluster did not return the log of pod {{ diag_logs_pod }} (HTTP {{ diag_logs_read.results | map(attribute='status', default='none') | join(' and ') }}).
          {%- elif diag_logs_matches | length == 0 -%}
          No warnings or errors in the last {{ diag_logs_lines | length }} lines of the {{ diag_logs_which }} container log of pod {{ diag_logs_pod }}.
          {%- else -%}
          {{ diag_logs_which | capitalize }} container log of pod {{ diag_logs_pod }}: {{ diag_logs_matches | length }} of the last
          {{ diag_logs_lines | length }} lines are warnings or errors, in {{ diag_logs_summary | length }} distinct message(s){{
          ' (the last ' ~ diag_logs_keep ~ ' shown)' if diag_logs_summary | length > diag_logs_keep else '' }}:
          {{ diag_logs_summary[-diag_logs_keep:] | join('; ') }}
          {%- endif -%}
        ref: "/api/v1/namespaces/{{ evidence_target.namespace }}/pods/{{ diag_logs_pod }}/log"
  vars:
    diag_logs_used: >-
      {{ diag_logs_read.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'equalto', 200) | first | default(none) }}
    diag_logs_which: "{{ 'previous' if diag_logs_used and diag_logs_used.item == 'true' else 'current' }}"
    diag_logs_lines: "{{ (diag_logs_used.content | default('')).splitlines() if diag_logs_used else [] }}"
    diag_logs_matches: "{{ diag_logs_lines | select('search', diag_logs_pattern) | list }}"
    diag_logs_summary: "{{ diag_logs_summary_json | from_json }}"
    diag_logs_summary_json: >-
      {%- set ns = namespace(keys=[], groups={}) -%}
      {%- for line in diag_logs_matches -%}
      {%- set ts = (line | regex_search('^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d')) or '' -%}
      {%- set msg = line | regex_replace('^\d{4}-\d\d-\d\dT[0-9:.]+Z?\s*', '') | truncate(diag_logs_line_limit) -%}
      {%- set key = msg | regex_replace('[0-9]+', '#') -%}
      {%- if key in ns.groups -%}
      {%- set g = ns.groups[key] -%}
      {%- set ns.groups = ns.groups | combine({key: {'count': g.count + 1, 'first': g.first, 'first_ts': g.first_ts, 'last': msg, 'last_ts': ts}}) -%}
      {%- else -%}
      {%- set ns.keys = ns.keys + [key] -%}
      {%- set ns.groups = ns.groups | combine({key: {'count': 1, 'first': msg, 'first_ts': ts, 'last': msg, 'last_ts': ts}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set out = namespace(lines=[]) -%}
      {%- for key in ns.keys -%}
      {%- set g = ns.groups[key] -%}
      {%- set first_at = g.first_ts | replace('T', ' ') -%}
      {%- set last_at = (g.last_ts[11:19] if g.last_ts[:10] == g.first_ts[:10] else g.last_ts | replace('T', ' ')) if g.last_ts else '' -%}
      {%- if g.count == 1 -%}
      {%- set text = '"' ~ g.first ~ '"' ~ (' at ' ~ first_at ~ ' UTC' if first_at else '') -%}
      {%- elif g.first == g.last -%}
      {%- set text = g.count ~ ' times' ~ ((' from ' ~ first_at ~ ' to ' ~ last_at ~ ' UTC') if first_at else '') ~ ': "' ~ g.first ~ '"' -%}
      {%- else -%}
      {%- set text = g.count ~ ' times' ~ ((' from ' ~ first_at ~ ' to ' ~ last_at ~ ' UTC') if first_at else '') ~ ', first "' ~ g.first
            ~ '", last "' ~ g.last ~ '"' -%}
      {%- endif -%}
      {%- set out.lines = out.lines + [text] -%}
      {%- endfor -%}
      {{ out.lines | to_json }}
  # The log text is shown only once redacted, by the evidence role (DD28), not here at higher verbosity.
  no_log: true

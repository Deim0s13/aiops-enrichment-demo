---
# Phase 08: the sample service payments-notify (DD01) in demo-payments, built in the cluster, with its
# heap metrics, alert rules and network policies, and a check of the single fault scenario end to end.
#   ansible-navigator run playbooks/08_workload.yml
#
# Run phases 01 (user workload monitoring) and 07 (the integration stand-in the alerts are routed to)
# first. The cluster builds from GitHub, so push changes to services/payments-notify first. Safe to
# rerun; the check triggers the fault once on each run, which raises or adds to a real incident and
# takes about five minutes. reset.yml closes the incident.

- name: "Phase 08 | Workload: payments-notify, its metrics and alert rules"
  hosts: localhost
  gather_facts: false
  tags: [workload]

  # See playbooks/01_platform.yml for why the modules are listed one by one.
  module_defaults:
    kubernetes.core.k8s: &cluster_auth
      host: "{{ secrets_values.cluster_api_url }}"
      api_key: "{{ secrets_values.cluster_api_token }}"
      validate_certs: "{{ demo_cluster_validate_certs }}"
      ca_cert: "{{ secrets_cluster_ca_file | default(omit) }}"
    kubernetes.core.k8s_info: *cluster_auth
    kubernetes.core.k8s_log: *cluster_auth

  tasks:
    - name: Resolve the cluster, ServiceNow and source secrets
      ansible.builtin.include_role:
        name: secrets
      vars:
        secrets_groups: [cluster, servicenow, source]

    - name: Check that the ServiceNow PDI is awake
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: awake

    - name: Deploy payments-notify and prove the fault
      ansible.builtin.include_role:
        name: workload
      vars:
        workload_namespace: "{{ demo_namespaces.workload }}"
        workload_caller_namespace: "{{ demo_namespaces.aap }}"
        workload_repository: "{{ demo_repository }}"
        workload_assignment_group: "{{ demo_servicenow.assignment_group }}"

    - name: Report what phase 08 found and changed
      ansible.builtin.debug:
        msg: "{{ workload_report }}"

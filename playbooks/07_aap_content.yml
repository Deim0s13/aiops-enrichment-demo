---
# Phase 07: the demo's content in AAP (design sections 5 and 6.1), declared as data and applied with
# infra.aap_configuration, then proved end to end.
#   ansible-navigator run playbooks/07_aap_content.yml
#
# Run phases 03, 04 and 06 and publish the execution environment first:
#   ansible-playbook playbooks/07_execution_environment.yml
# Safe to rerun.

- name: "Phase 07 | AAP content and the trigger: workflow, event stream, rulebook activation and ServiceNow business rule"
  hosts: localhost
  gather_facts: false
  tags: [aap_content]

  # See playbooks/01_platform.yml for why the modules are listed one by one.
  module_defaults:
    kubernetes.core.k8s: &cluster_auth
      host: "{{ secrets_values.cluster_api_url }}"
      api_key: "{{ secrets_values.cluster_api_token }}"
      validate_certs: "{{ demo_cluster_validate_certs }}"
      ca_cert: "{{ secrets_cluster_ca_file | default(omit) }}"
    kubernetes.core.k8s_info: *cluster_auth

  tasks:
    - name: Resolve the cluster, ServiceNow and source secrets
      ansible.builtin.include_role:
        name: secrets
      vars:
        secrets_groups: [cluster, servicenow, source]

    - name: Declare and prove the AAP content
      ansible.builtin.include_role:
        name: aap_content
      vars:
        aap_content_namespace: "{{ demo_namespaces.aap }}"
        aap_content_organisation: "{{ demo_aap_organisation }}"
        aap_content_repository: "{{ demo_repository }}"
        aap_content_ee_stream: "{{ demo_execution_environment.name }}"
        aap_content_de_image_override: "{{ demo_aap_decision_environment }}"

    - name: Connect ServiceNow to the event stream, and prove it hands-off
      ansible.builtin.include_role:
        name: servicenow
        tasks_from: trigger
      vars:
        servicenow_assignment_group: "{{ demo_servicenow.assignment_group }}"
        servicenow_trigger_category: "{{ demo_servicenow.category }}"
        servicenow_secret_namespace: "{{ demo_namespaces.aap }}"

    - name: Report what phase 07 found and changed
      ansible.builtin.debug:
        msg: "{{ aap_content_report + servicenow_report }}"

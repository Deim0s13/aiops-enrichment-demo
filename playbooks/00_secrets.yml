---
# Runs on the operator's laptop, outside the execution environment:
#   ansible-galaxy collection install -r collections/requirements-laptop.yml
#   ansible-playbook playbooks/00_secrets.yml
#
# First run: starts Vault, initialises it, enables the KV engine, writes a read-only
# policy and AppRole, and writes the unseal key, root token and AppRole credentials to
# ~/.config/aiops-demo for the operator.
# Later runs: starts and unseals Vault (set AIOPS_VAULT_UNSEAL_KEY).
# Reconfigure: -e vault_bootstrap_reconfigure=true, or rotate the secret ID with
# -e vault_bootstrap_rotate_secret_id=true (both need VAULT_TOKEN).

- name: "Phase 00 | Secrets: Vault on the operator's laptop"
  hosts: localhost
  gather_facts: false
  tags: [secrets]
  roles:
    - role: vault_bootstrap

---
# Phase 02: configures OpenShift AI for the demo (DD04, DD07, DD14). Built in three parts; part 1
# checks the OpenShift AI version and installs Red Hat Connectivity Link; part 2 deploys PostgreSQL,
# the MaaS gateway, and switches on Models-as-a-Service and MLflow.
#   ansible-navigator run playbooks/02_openshift_ai.yml
#
# Safe to rerun. Run preflight and phase 01 first.

- name: "Phase 02 | OpenShift AI: Models-as-a-Service, MLflow and model serving"
  hosts: localhost
  gather_facts: false
  tags: [openshift_ai]

  # See playbooks/01_platform.yml for why the modules are listed one by one.
  module_defaults:
    kubernetes.core.k8s: &cluster_auth
      host: "{{ secrets_values.cluster_api_url }}"
      api_key: "{{ secrets_values.cluster_api_token }}"
      validate_certs: "{{ demo_cluster_validate_certs }}"
      ca_cert: "{{ secrets_cluster_ca_file | default(omit) }}"
    kubernetes.core.k8s_info: *cluster_auth

  tasks:
    - name: Resolve the cluster secrets
      ansible.builtin.include_role:
        name: secrets
      vars:
        secrets_groups: [cluster]

    - name: Configure OpenShift AI
      ansible.builtin.include_role:
        name: openshift_ai

    - name: Report what phase 02 found and changed
      ansible.builtin.debug:
        msg: "{{ openshift_ai_report }}"

---
# Runs one Job to completion and keeps its outcome and the last line it printed. Input: knowledge_job
# with name, namespace and the pod spec. Output: knowledge_job_succeeded and knowledge_job_output.
- name: "Remove the previous run of {{ knowledge_job.name }}"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ knowledge_job.namespace }}"
    name: "{{ knowledge_job.name }}"
    delete_options:
      propagationPolicy: Foreground
    wait: true

- name: "Run {{ knowledge_job.name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "{{ knowledge_job.name }}"
        namespace: "{{ knowledge_job.namespace }}"
        labels: { app.kubernetes.io/part-of: aiops-enrichment-demo, app.kubernetes.io/component: knowledge }
      spec:
        backoffLimit: 0
        template:
          metadata:
            labels: { app.kubernetes.io/part-of: aiops-enrichment-demo, app.kubernetes.io/component: knowledge }
          spec: "{{ knowledge_job.spec | combine({'restartPolicy': 'Never'}) }}"

- name: "Wait for the Job to finish: {{ knowledge_job.name }}"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ knowledge_job.namespace }}"
    name: "{{ knowledge_job.name }}"
  register: knowledge_job_state
  until: >-
    knowledge_job_state is not failed
    and ((knowledge_job_state.resources | first | default({})).status | default({})).succeeded | default(0)
        + ((knowledge_job_state.resources | first | default({})).status | default({})).failed | default(0) >= 1
  retries: "{{ knowledge_job_retries }}"
  delay: "{{ knowledge_job_delay }}"
  failed_when: false
  no_log: true

- name: "Read what the Job printed: {{ knowledge_job.name }}"
  kubernetes.core.k8s_log:
    namespace: "{{ knowledge_job.namespace }}"
    label_selectors: ["job-name={{ knowledge_job.name }}"]
  register: knowledge_job_log
  failed_when: false
  no_log: true

- name: "Keep the outcome: {{ knowledge_job.name }}"
  ansible.builtin.set_fact:
    knowledge_job_succeeded: >-
      {{ ((knowledge_job_state.resources | default([{}]) | first | default({})).status | default({})).succeeded | default(0) >= 1 }}
    knowledge_job_output: "{{ knowledge_job_log.log_lines | default([]) | select | list | last | default('') }}"

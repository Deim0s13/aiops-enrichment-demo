---
argument_specs:
  main:
    short_description: Build the knowledge index and load the approved corpus into it
    description:
      - Creates the knowledge database in the shared PostgreSQL with pgvector, an ingestion identity that owns it
        and a read-only identity limited by row-level security to approved, internal passages (DD21).
      - Reads the corpus from the repository's branch with the read-only GitHub token, and loads it with a Job that
        runs the enrichment service's image, which carries the embedding model.
      - Proves the result as the read-only identity, on every build.
    options:
      knowledge_namespace:
        type: str
        required: true
        description: The enrichment namespace, where the image is built and the ingestion Job runs.
      knowledge_data_namespace:
        type: str
        required: true
        description: The namespace of the shared PostgreSQL.
      knowledge_postgres_image:
        type: str
        required: true
        description: The PostgreSQL image, for the database setup Job.
      knowledge_repository:
        type: dict
        required: true
        description: The repository, with url, owner, name and branch.
      knowledge_checks:
        type: bool
        description: Prove the index as the read-only identity.
      knowledge_check_expected_first:
        type: list
        elements: str
        description: Documents one of which a search for the memory fault should return first.
      knowledge_check_never:
        type: list
        elements: str
        description: Documents a search for the memory fault must never return.
  refresh:
    short_description: Reload the index from the corpus at a commit, without phase 05's setup (DD34)
    description:
      - Runs the ingestion Job with the enrichment service's deployed image. Run after a merge to main by the
        knowledge bot's refresh job, and by reset.yml after it removes the demo's resolutions.
    options:
      knowledge_namespace:
        type: str
        required: true
        description: The enrichment namespace, where the service runs and the ingestion Job runs.
      knowledge_repository:
        type: dict
        required: true
        description: The repository, with url, owner, name and branch.
      knowledge_source_ref:
        type: str
        description: The commit or branch to read the corpus at; the repository's branch by default.
      knowledge_github_token:
        type: str
        description: A token that can read the repository; the read-only token from Vault by default.
  drafted:
    short_description: List the resolutions on the branch that the knowledge bot drafted (DD34)
    description:
      - Sets knowledge_drafted, each with path, id, service and blob, and knowledge_drafted_commit.
    options:
      knowledge_repository:
        type: dict
        required: true
        description: The repository, with url, owner, name and branch.
      knowledge_github_token:
        type: str
        description: A token that can read the repository; the read-only token from Vault by default.

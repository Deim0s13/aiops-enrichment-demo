---
# Shared PostgreSQL for the demo (DD06): one instance, a database and user per consumer.
# The namespace, image and databases are inputs (meta/argument_specs.yml).
postgres_name: postgres
postgres_storage_size: 20Gi

# Generated once, on the first build, and kept in this Secret for the life of the environment.
postgres_credentials_secret: postgres-credentials

postgres_ready_retries: 30
postgres_ready_delay: 10

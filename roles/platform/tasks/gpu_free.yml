---
# The environment ships a sample model that holds the only GPU. Pods that have finished are
# ignored: the GPU Operator's CUDA validator, for example, requests a GPU and then completes.
# The demo's own model namespaces are ignored too, so the phase can be rerun after phase 02.

- name: List running and pending pods
  kubernetes.core.k8s_info:
    kind: Pod
    field_selectors:
      - status.phase!=Succeeded
      - status.phase!=Failed
  register: platform_pods
  until: platform_pods is not failed
  retries: 3
  delay: 5

- name: Find the namespaces whose pods request a GPU
  ansible.builtin.set_fact:
    platform_gpu_holders: >-
      {{ platform_pods.resources
         | community.general.json_query(platform_gpu_request_query)
         | unique | reject('in', platform_model_namespaces) | sort }}

- name: Sort the GPU holders into samples to delete and workloads to leave alone
  ansible.builtin.set_fact:
    platform_gpu_reclaim: >-
      {{ (platform_gpu_holders | select('in', platform_gpu_reclaimable_namespaces) | list)
         if platform_free_gpu | bool else [] }}
    platform_gpu_blocking: >-
      {{ (platform_gpu_holders | reject('in', platform_gpu_reclaimable_namespaces) | list)
         if platform_free_gpu | bool else platform_gpu_holders }}

- name: Stop if a workload the build does not own holds the GPU
  ansible.builtin.assert:
    that: platform_gpu_blocking | length == 0
    fail_msg: >-
      Pods in {{ platform_gpu_blocking | join(', ') }} hold the GPU. The model needs the only GPU,
      so it would stay Pending.
      {{ 'Free it and rerun, or, if the environment always ships this namespace as a sample,
      add it to demo_gpu_reclaimable_namespaces.' if platform_free_gpu | bool
      else 'demo_free_gpu is false, so the build leaves it alone. Free it and rerun.' }}
    quiet: true

- name: Delete sample namespaces that hold the GPU
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    state: absent
    wait: true
    wait_timeout: "{{ platform_namespace_delete_timeout }}"
  loop: "{{ platform_gpu_reclaim }}"

- name: Wait until no other workload holds the GPU
  kubernetes.core.k8s_info:
    kind: Pod
    field_selectors:
      - status.phase!=Succeeded
      - status.phase!=Failed
  register: platform_pods_after
  until: >-
    platform_pods_after.resources
    | community.general.json_query(platform_gpu_request_query)
    | reject('in', platform_model_namespaces) | list | length == 0
  retries: "{{ platform_gpu_release_retries }}"
  delay: "{{ platform_gpu_release_delay }}"
  when: platform_gpu_reclaim | length > 0

- name: Record the GPU result
  ansible.builtin.set_fact:
    platform_report: >-
      {{ platform_report + ['GPU: ' ~ (('deleted the sample namespace ' ~ platform_gpu_reclaim | join(', '))
                                       if platform_gpu_reclaim else 'free, nothing to delete')] }}

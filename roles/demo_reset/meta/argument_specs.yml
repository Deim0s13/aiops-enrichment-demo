---
argument_specs:
  main:
    short_description: Close the demo's incidents and remove build-check leftovers
    description:
      - Resolves and closes every open incident svc-monitoring raised in the on-call group, with a close note.
      - Deletes incidents the build checks left behind, and the emails ServiceNow queued for them.
      - Touches nothing else in the PDI.
    options:
      demo_reset_assignment_group:
        type: str
        required: true
        description: The on-call group whose demo incidents are closed.
      demo_reset_correlation_id:
        type: str
        description: Close only the open incident with this correlation ID, the problem the integration stand-in raised it for.
      demo_reset_close_notes:
        type: str
        description: The close note written on each incident closed.
  knowledge:
    short_description: Close the knowledge bot's open pull requests and delete their branches (DD33)
    options:
      demo_reset_repository:
        type: str
        required: true
        description: The repository, as owner/name.
  learned:
    short_description: Remove the resolutions the knowledge bot drafted from main, and refresh the index (DD34)
    options:
      demo_reset_knowledge_repository:
        type: dict
        required: true
        description: The repository, with url, owner, name and branch.
      demo_reset_knowledge_namespace:
        type: str
        required: true
        description: The enrichment namespace, where the index refresh runs its ingestion Job.
      demo_reset_knowledge_refresh:
        type: bool
        default: true
        description: Refresh the index after removing the resolutions; false when the cluster has gone.

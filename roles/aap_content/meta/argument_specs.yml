---
argument_specs:
  main:
    short_description: Declare the demo's AAP content and prove it works
    description:
      - "Controller: organisation, project, execution environment, ServiceNow credential, inventory, the enrichment
        job templates, the four diagnostic job templates with their time-limited cluster credential (DD20), and the AI incident
        enrichment workflow with its failure branch."
      - "EDA: the AAP user the trigger runs as, a project, a decision environment, the event stream ServiceNow
        posts to, and the rulebook activation."
      - "The monitoring integration stand-in (DD19): its job template and ServiceNow credential, its own AAP user,
        the event stream Alertmanager posts to with Basic authentication, and its activation."
      - Reads the cluster and source secrets from secrets_values, and the AAP admin, ServiceNow identity and
        generated secrets from the cluster.
    options:
      aap_content_namespace:
        type: str
        required: true
        description: The AAP namespace, which also holds the published execution environment and the generated Secrets.
      aap_content_organisation:
        type: str
        required: true
        description: The AAP organisation that owns the content.
      aap_content_repository:
        type: dict
        required: true
        description: The repository AAP syncs as its project, with url, owner, name and branch.
      aap_content_integration_assignment_group:
        type: str
        required: true
        description: Assignment group of the incidents the integration raises.
      aap_content_integration_category:
        type: str
        required: true
        description: Category of the incidents the integration raises.
      aap_content_service_map:
        type: dict
        required: true
        description: Configuration items the diagnostics may look at, each with namespace, app and container (design 5.2).
      aap_content_workload_url:
        type: str
        required: true
        description: Address of payments-notify inside the cluster, for the fault trigger job template.
      aap_content_ee_stream:
        type: str
        required: true
        description: Name of the image stream that holds the published execution environment (phase 07, first step).
      aap_content_de_image_override:
        type: str
        description: Decision environment image to use instead of the one the platform set up in EDA.
      aap_content_checks:
        type: bool
        description: Prove the trigger, workflow, failure branch, idempotency and the trigger user's limits, and the integration.
      aap_content_check_service:
        type: str
        description: Service label on the integration check's alerts.

---
# The content, as data for infra.aap_configuration. Each aap_content_cfg_ variable is passed to the
# dispatch role under the name it expects, without the prefix (main.yml). Facts holding credentials are set under no_log.

- name: Declare the organisation and the controller content
  ansible.builtin.set_fact:
    aap_content_cfg_aap_organizations:
      - name: "{{ aap_content_organisation }}"
        description: Fictional bank for the AI-assisted incident enrichment demo.

    # Project syncs install no content: everything the jobs need is in the execution environment,
    # which is built, reviewed and published once (DD17).
    aap_content_cfg_controller_settings:
      - name: AWX_COLLECTIONS_ENABLED
        value: false
      - name: AWX_ROLES_ENABLED
        value: false

    # The servicenow.itsm modules read their connection from these variables, so no playbook or
    # job template holds a ServiceNow address or password.
    aap_content_cfg_controller_credential_types:
      - name: "{{ aap_content_servicenow_credential_type }}"
        description: A ServiceNow identity, passed to the servicenow.itsm modules as SN_HOST, SN_USERNAME and SN_PASSWORD.
        kind: cloud
        inputs:
          fields:
            - { id: instance_url, type: string, label: Instance URL }
            - { id: username, type: string, label: Username }
            - { id: password, type: string, label: Password, secret: true }
          required: [instance_url, username, password]
        injectors:
          env:
            SN_HOST: !unsafe "{{ instance_url }}"
            SN_USERNAME: !unsafe "{{ username }}"
            SN_PASSWORD: !unsafe "{{ password }}"
      # The CA bundle is written to a file for the job, so the call to the service is checked against
      # OpenShift's service CA rather than trusted blindly.
      - name: "{{ aap_content_enrichment_credential_type }}"
        description: The enrichment service's address, token and CA bundle, passed to jobs as ENRICHMENT_URL, ENRICHMENT_TOKEN and ENRICHMENT_CA_FILE.
        kind: cloud
        inputs:
          fields:
            - { id: url, type: string, label: Service URL }
            - { id: token, type: string, label: API token, secret: true }
            - { id: ca_bundle, type: string, label: CA bundle, multiline: true }
          required: [url, token, ca_bundle]
        injectors:
          file:
            template: !unsafe "{{ ca_bundle }}"
          env:
            ENRICHMENT_URL: !unsafe "{{ url }}"
            ENRICHMENT_TOKEN: !unsafe "{{ token }}"
            ENRICHMENT_CA_FILE: !unsafe "{{ tower.filename }}"

    aap_content_cfg_controller_execution_environments:
      - name: "{{ aap_content_ee_name }}"
        description: Built on the operator's laptop and published to the cluster registry, pinned by digest (DD17).
        organization: "{{ aap_content_organisation }}"
        image: "{{ aap_content_ee_image }}"
        pull: missing

    aap_content_cfg_controller_projects:
      - name: "{{ aap_content_project_name }}"
        description: The demo repository, read with a read-only token (DD16).
        organization: "{{ aap_content_organisation }}"
        scm_type: git
        scm_url: "{{ aap_content_repository.url }}"
        scm_branch: "{{ aap_content_repository.branch }}"
        credential: "{{ aap_content_github_credential }}"
        default_environment: "{{ aap_content_ee_name }}"
        update_project: true
        wait: true

    aap_content_cfg_controller_inventories:
      - name: "{{ aap_content_inventory_name }}"
        description: The automation runs in the job's own container and calls APIs from there.
        organization: "{{ aap_content_organisation }}"

    aap_content_cfg_controller_hosts:
      - name: localhost
        inventory: "{{ aap_content_inventory_name }}"
        variables:
          ansible_connection: local

    aap_content_cfg_controller_templates:
      - name: "{{ aap_content_templates.pending }}"
        description: "Workflow step 1: marks the incident pending, so the trigger cannot fire for it again."
        playbook: automation/enrichment/mark_pending.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        credentials: ["{{ aap_content_servicenow_credential }}"]
        ask_variables_on_launch: true
      - name: "{{ aap_content_templates.note }}"
        description: "Workflow step 2: asks the enrichment service, checks its answer and writes the AI-labelled work note, once per revision."
        playbook: automation/enrichment/write_note.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        credentials: ["{{ aap_content_servicenow_credential }}", "{{ aap_content_enrichment_credential }}"]
        extra_vars:
          enrichment_catalogue: "{{ aap_content_catalogue }}"
        ask_variables_on_launch: true
      - name: "{{ aap_content_templates.unavailable }}"
        description: "Failure branch: records that enrichment is unavailable; the incident stays with its team."
        playbook: automation/enrichment/record_unavailable.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        credentials: ["{{ aap_content_servicenow_credential }}"]
        ask_variables_on_launch: true

      # The four diagnostics (design 5.2). Read-only, bounded, and run in parallel as the aiops-diagnostics
      # service account. A diagnostic that fails publishes a gap item instead, and one that runs too
      # long is stopped, so the note is written either way.
      - name: "{{ aap_content_diagnostics.pod_status }}"
        description: "Diagnostic, read-only: pods, restarts, last terminations and recent warning events."
        playbook: automation/diagnostics/pod_status.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        timeout: "{{ aap_content_diagnostics_timeout }}"
        credentials: ["{{ aap_content_diagnostics_credential }}"]
        extra_vars:
          diagnostics_service_map: "{{ aap_content_service_map }}"
        ask_variables_on_launch: true
      - name: "{{ aap_content_diagnostics.metrics }}"
        description: "Diagnostic, read-only: heap, container memory and restarts over the last 30 minutes."
        playbook: automation/diagnostics/metrics.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        timeout: "{{ aap_content_diagnostics_timeout }}"
        credentials: ["{{ aap_content_diagnostics_credential }}"]
        extra_vars:
          diagnostics_service_map: "{{ aap_content_service_map }}"
        ask_variables_on_launch: true
      - name: "{{ aap_content_diagnostics.changes }}"
        description: "Diagnostic, read-only: rollouts and running configuration, and the configuration item's change requests, in the last 24 hours."
        playbook: automation/diagnostics/changes.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        timeout: "{{ aap_content_diagnostics_timeout }}"
        credentials: ["{{ aap_content_diagnostics_credential }}", "{{ aap_content_servicenow_credential }}"]
        extra_vars:
          diagnostics_service_map: "{{ aap_content_service_map }}"
        ask_variables_on_launch: true
      - name: "{{ aap_content_diagnostics.logs }}"
        description: "Diagnostic, read-only: warnings and errors from the container log, within line and byte limits."
        playbook: automation/diagnostics/logs.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        timeout: "{{ aap_content_diagnostics_timeout }}"
        credentials: ["{{ aap_content_diagnostics_credential }}"]
        extra_vars:
          diagnostics_service_map: "{{ aap_content_service_map }}"
        ask_variables_on_launch: true

      # The monitoring integration stand-in (DD19). Runs one job at a time, so two notifications
      # about the same problem cannot both find no incident and raise one each.
      - name: "{{ aap_content_integration_template }}"
        description: "Integration stand-in: raises or updates the incident for an Alertmanager notification, one incident per service and problem."
        playbook: automation/integration/raise_incident.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        credentials: ["{{ aap_content_integration_servicenow_credential }}"]
        extra_vars:
          integration_assignment_group: "{{ aap_content_integration_assignment_group }}"
          integration_category: "{{ aap_content_integration_category }}"
        ask_variables_on_launch: true
        allow_simultaneous: false

      # A demo control, not part of the enrichment path: the presenter starts the fault here.
      - name: "{{ aap_content_fault_template }}"
        description: >-
          Starts a payments-notify fault. single: OOMKilled once, comes back clean. recurring: keeps coming back until cleared.
          throttling: MessageHub refuses deliveries, a fault with no runbook (S2). Run reset.yml between scenarios.
        playbook: automation/demo/trigger_fault.yml
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        inventory: "{{ aap_content_inventory_name }}"
        execution_environment: "{{ aap_content_ee_name }}"
        extra_vars:
          fault_service_url: "{{ aap_content_workload_url }}"
        survey_enabled: true
        survey_spec:
          name: payments-notify fault
          description: Which scenario to run
          spec:
            - question_name: Scenario
              question_description: >-
                single: OOMKilled once, comes back clean. recurring: keeps coming back until cleared. throttling: MessageHub
                refuses deliveries for about 15 minutes, a fault with no runbook.
              variable: fault_scenario
              type: multiplechoice
              choices: [single, recurring, throttling]
              default: single
              required: true

    # Failing to mark the incident pending or to write the note leads to the failure branch (design 5.5).
    # A failed diagnostic does not: the note is written without its evidence.
    aap_content_cfg_controller_workflows:
      - name: "{{ aap_content_workflow_name }}"
        description: Enriches one incident. Launched by the trigger with the incident's fields only.
        organization: "{{ aap_content_organisation }}"
        ask_variables_on_launch: true
        allow_simultaneous: true
        # The diagnostics run side by side; the note waits for all four, whatever their outcome.
        simplified_workflow_nodes:
          - identifier: pending
            unified_job_template: "{{ aap_content_templates.pending }}"
            success_nodes: [pod_status, metrics, changes, logs]
            failure_nodes: [unavailable]
          - identifier: pod_status
            unified_job_template: "{{ aap_content_diagnostics.pod_status }}"
            always_nodes: [note]
          - identifier: metrics
            unified_job_template: "{{ aap_content_diagnostics.metrics }}"
            always_nodes: [note]
          - identifier: changes
            unified_job_template: "{{ aap_content_diagnostics.changes }}"
            always_nodes: [note]
          - identifier: logs
            unified_job_template: "{{ aap_content_diagnostics.logs }}"
            always_nodes: [note]
          - identifier: note
            unified_job_template: "{{ aap_content_templates.note }}"
            all_parents_must_converge: true
            failure_nodes: [unavailable]
          - identifier: unavailable
            unified_job_template: "{{ aap_content_templates.unavailable }}"

    # Each activation's user may launch its own template and nothing else (design 6.1).
    aap_content_cfg_controller_roles:
      - user: "{{ aap_content_eda_user }}"
        workflow: "{{ aap_content_workflow_name }}"
        role: execute
      - user: "{{ aap_content_integration_eda_user }}"
        job_template: "{{ aap_content_integration_template }}"
        role: execute

- name: Declare the content's credentials and the trigger's user
  ansible.builtin.set_fact:
    aap_content_cfg_aap_user_accounts:
      - username: "{{ aap_content_eda_user }}"
        password: "{{ aap_content_eda_password }}"
        first_name: EDA
        last_name: Enrichment trigger
        email: "{{ aap_content_eda_user }}@acme-bank.example"
        is_superuser: false
        organizations: ["{{ aap_content_organisation }}"]
        # Set the password only when it was just generated, so a rerun changes nothing.
        update_secrets: "{{ aap_content_eda_password_new }}"
      - username: "{{ aap_content_integration_eda_user }}"
        password: "{{ aap_content_integration_password }}"
        first_name: EDA
        last_name: Monitoring integration
        email: "{{ aap_content_integration_eda_user }}@acme-bank.example"
        is_superuser: false
        organizations: ["{{ aap_content_organisation }}"]
        update_secrets: "{{ aap_content_integration_password_new }}"

    aap_content_cfg_controller_credentials:
      - name: "{{ aap_content_github_credential }}"
        description: Fine-grained GitHub token, this repository only, contents read-only (DD16).
        organization: "{{ aap_content_organisation }}"
        credential_type: Source Control
        inputs:
          username: "{{ aap_content_repository.owner }}"
          password: "{{ secrets_values.github_token }}"
      - name: "{{ aap_content_enrichment_credential }}"
        description: The enrichment service's address, its API token and the service CA bundle (phase 06).
        organization: "{{ aap_content_organisation }}"
        credential_type: "{{ aap_content_enrichment_credential_type }}"
        inputs:
          url: "{{ aap_content_enrichment.url }}"
          token: "{{ aap_content_enrichment.token }}"
          ca_bundle: "{{ aap_content_service_ca }}"
      # Read-only on the workload's namespace; the token expires on its own (DD20). The jobs get it as
      # K8S_AUTH_HOST, K8S_AUTH_API_KEY and K8S_AUTH_SSL_CA_CERT.
      - name: "{{ aap_content_diagnostics_credential }}"
        description: Time-limited token for the aiops-diagnostics service account, which can only view the workload's namespace (DD20).
        organization: "{{ aap_content_organisation }}"
        credential_type: OpenShift or Kubernetes API Bearer Token
        inputs:
          host: "{{ aap_content_diagnostics_api }}"
          bearer_token: "{{ aap_content_diag_token }}"
          verify_ssl: true
          ssl_ca_cert: "{{ aap_content_diag_ca }}"
      - name: "{{ aap_content_servicenow_credential }}"
        description: The ITSM writer identity. Guard rules in ServiceNow limit it to work notes and enrichment fields.
        organization: "{{ aap_content_organisation }}"
        credential_type: "{{ aap_content_servicenow_credential_type }}"
        inputs:
          instance_url: "{{ aap_content_servicenow.instance_url }}"
          username: "{{ aap_content_servicenow.username }}"
          password: "{{ aap_content_servicenow.password }}"
      - name: "{{ aap_content_integration_servicenow_credential }}"
        description: The integration stand-in's identity. Guard rules in ServiceNow stop it setting the AI enrichment fields.
        organization: "{{ aap_content_organisation }}"
        credential_type: "{{ aap_content_servicenow_credential_type }}"
        inputs:
          instance_url: "{{ aap_content_monitoring.instance_url }}"
          username: "{{ aap_content_monitoring.username }}"
          password: "{{ aap_content_monitoring.password }}"

    aap_content_cfg_eda_credentials:
      - name: "{{ aap_content_eda_aap_credential }}"
        description: The trigger launches the enrichment workflow as this AAP user, which can launch nothing else.
        organization: "{{ aap_content_organisation }}"
        credential_type: Red Hat Ansible Automation Platform
        inputs:
          host: "{{ aap_content_url }}/api/controller/"
          username: "{{ aap_content_eda_user }}"
          password: "{{ aap_content_eda_password }}"
          verify_ssl: "{{ aap_content_validate_certs }}"
      - name: "{{ aap_content_github_credential }}"
        description: Fine-grained GitHub token, this repository only, contents read-only (DD16).
        organization: "{{ aap_content_organisation }}"
        credential_type: Source Control
        inputs:
          username: "{{ aap_content_repository.owner }}"
          password: "{{ secrets_values.github_token }}"
      - name: "{{ aap_content_event_stream_credential }}"
        description: The token ServiceNow sends in a header with every event.
        organization: "{{ aap_content_organisation }}"
        credential_type: Token Event Stream
        inputs:
          auth_type: token
          token: "{{ aap_content_stream_token }}"
          http_header_key: "{{ aap_content_event_stream_header }}"
      - name: "{{ aap_content_integration_eda_aap_credential }}"
        description: The integration activation launches its job template as this AAP user, which can launch nothing else.
        organization: "{{ aap_content_organisation }}"
        credential_type: Red Hat Ansible Automation Platform
        inputs:
          host: "{{ aap_content_url }}/api/controller/"
          username: "{{ aap_content_integration_eda_user }}"
          password: "{{ aap_content_integration_password }}"
          verify_ssl: "{{ aap_content_validate_certs }}"
      - name: "{{ aap_content_alert_stream_credential }}"
        description: The user name and password Alertmanager signs in with on every notification.
        organization: "{{ aap_content_organisation }}"
        credential_type: Basic Event Stream
        inputs:
          auth_type: basic
          username: "{{ aap_content_alert_stream_username }}"
          password: "{{ aap_content_alert_stream_password }}"
          http_header_key: Authorization
  no_log: true

- name: Declare the trigger
  ansible.builtin.set_fact:
    aap_content_cfg_eda_projects:
      - name: "{{ aap_content_project_name }}"
        description: The demo repository, read with a read-only token (DD16).
        organization: "{{ aap_content_organisation }}"
        url: "{{ aap_content_repository.url }}"
        scm_branch: "{{ aap_content_repository.branch }}"
        credential: "{{ aap_content_github_credential }}"
        sync: true

    aap_content_cfg_eda_decision_environments:
      - name: "{{ aap_content_de_name }}"
        description: Red Hat's supported decision environment, pinned in the kit's inventory (DD12).
        organization: "{{ aap_content_organisation }}"
        image_url: "{{ aap_content_de_image }}"

    aap_content_cfg_eda_event_streams:
      - name: "{{ aap_content_event_stream_name }}"
        organization: "{{ aap_content_organisation }}"
        credential_name: "{{ aap_content_event_stream_credential }}"
        forward_events: true
      - name: "{{ aap_content_alert_stream_name }}"
        organization: "{{ aap_content_organisation }}"
        credential_name: "{{ aap_content_alert_stream_credential }}"
        forward_events: true

    aap_content_cfg_eda_rulebook_activations:
      - name: "{{ aap_content_activation_name }}"
        description: Launches the enrichment workflow for each qualifying incident ServiceNow posts.
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        rulebook: "{{ aap_content_rulebook }}"
        decision_environment: "{{ aap_content_de_name }}"
        eda_credentials: ["{{ aap_content_eda_aap_credential }}"]
        event_streams:
          - source_name: "{{ aap_content_rulebook_source }}"
            event_stream: "{{ aap_content_event_stream_name }}"
        restart_policy: on-failure
        enabled: true
      - name: "{{ aap_content_integration_activation }}"
        description: "Integration stand-in: raises or updates the incident for each Alertmanager notification (DD19)."
        organization: "{{ aap_content_organisation }}"
        project: "{{ aap_content_project_name }}"
        rulebook: "{{ aap_content_integration_rulebook }}"
        decision_environment: "{{ aap_content_de_name }}"
        eda_credentials: ["{{ aap_content_integration_eda_aap_credential }}"]
        event_streams:
          - source_name: "{{ aap_content_integration_rulebook_source }}"
            event_stream: "{{ aap_content_alert_stream_name }}"
        restart_policy: on-failure
        enabled: true

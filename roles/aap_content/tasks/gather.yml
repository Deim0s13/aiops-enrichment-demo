---
# Reads from the cluster: the platform's address and admin password, the published execution
# environment and the operator's decision environment image, and the identities' credentials.
# Generated secrets are kept in Secrets and reused, so a rerun changes nothing.

- name: Read the platform's route and admin password, and the published execution environment
  kubernetes.core.k8s_info:
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ aap_content_namespace }}"
    name: "{{ item.name }}"
  loop:
    - { api_version: route.openshift.io/v1, kind: Route, name: "{{ aap_content_instance_name }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_instance_name }}-admin-password" }
    - { api_version: image.openshift.io/v1, kind: ImageStream, name: "{{ aap_content_ee_stream }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_servicenow_secret }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_eda_user_secret }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_event_stream_secret }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_enrichment_secret }}" }
    - { api_version: v1, kind: ConfigMap, name: "{{ aap_content_service_ca_configmap }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_integration_servicenow_secret }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_integration_eda_user_secret }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_alert_stream_secret }}" }
    - { api_version: v1, kind: Secret, name: "{{ aap_content_github_stream_secret }}" }
  loop_control:
    label: "{{ item.kind }} {{ item.name }}"
  register: aap_content_read
  until: aap_content_read is not failed
  retries: 3
  delay: 5
  no_log: true

- name: Keep only the fields needed
  ansible.builtin.set_fact:
    aap_content_found: >-
      {{ dict(['route', 'admin', 'stream', 'servicenow', 'eda_user', 'event_stream', 'enrichment', 'service_ca',
          'monitoring', 'integration_user', 'alert_stream', 'github_stream']
         | zip(aap_content_read.results | map(attribute='resources') | map('first') | map('default', {}, true))) }}
  no_log: true

- name: Stop if something phase 07 relies on is missing
  ansible.builtin.assert:
    that:
      - aap_content_found.route | length > 0
      - aap_content_found.admin | length > 0
      - aap_content_found.stream | length > 0
      - aap_content_found.servicenow | length > 0
      - aap_content_found.enrichment | length > 0
      - aap_content_found.service_ca | length > 0
      - aap_content_found.monitoring | length > 0
    fail_msg: >-
      Missing:
      {{ ([] + (['the AAP route (run phase 03)'] if not aap_content_found.route else [])
         + (['the AAP admin password Secret (run phase 03)'] if not aap_content_found.admin else [])
         + (['the published execution environment (run: ansible-playbook playbooks/07_execution_environment.yml)'] if not aap_content_found.stream else [])
         + (['the svc-ai-enrichment Secret (run phase 04)'] if not aap_content_found.servicenow else [])
         + (['the enrichment service token (run phase 06)'] if not aap_content_found.enrichment else [])
         + (['the service CA bundle ConfigMap'] if not aap_content_found.service_ca else [])
         + (['the svc-monitoring Secret (run phase 04)'] if not aap_content_found.monitoring else [])) | join('; ') }}.
    quiet: true

- name: Work out the addresses and the identities' credentials
  ansible.builtin.set_fact:
    aap_content_url: "https://{{ aap_content_found.route.spec.host }}"
    aap_content_admin_password: "{{ aap_content_found.admin.data.password | b64decode }}"
    aap_content_ee_image: >-
      {{ (aap_content_found.stream.status.tags | default([]) | selectattr('tag', 'equalto', 'latest') | first | default({}))['items']
         | default([{}]) | map(attribute='dockerImageReference', default='') | first }}
    aap_content_enrichment: >-
      {{ dict(aap_content_found.enrichment.data.keys() | zip(aap_content_found.enrichment.data.values() | map('b64decode'))) }}
    aap_content_service_ca: "{{ aap_content_found.service_ca.data['service-ca.crt'] }}"
    aap_content_servicenow: >-
      {{ dict(aap_content_found.servicenow.data.keys() | zip(aap_content_found.servicenow.data.values() | map('b64decode'))) }}
    aap_content_monitoring: >-
      {{ dict(aap_content_found.monitoring.data.keys() | zip(aap_content_found.monitoring.data.values() | map('b64decode'))) }}
    # Reuse the generated secrets if the cluster has them; otherwise make new ones.
    aap_content_eda_password_new: "{{ aap_content_found.eda_user | length == 0 }}"
    aap_content_eda_password: >-
      {{ (aap_content_found.eda_user.data.password | b64decode) if aap_content_found.eda_user
         else lookup('ansible.builtin.password', '/dev/null', length=aap_content_secret_length, chars=['ascii_letters', 'digits']) }}
    aap_content_stream_token_new: "{{ aap_content_found.event_stream | length == 0 }}"
    aap_content_stream_token: >-
      {{ (aap_content_found.event_stream.data.token | b64decode) if aap_content_found.event_stream
         else lookup('ansible.builtin.password', '/dev/null', length=aap_content_secret_length, chars=['ascii_letters', 'digits']) }}
    aap_content_integration_password_new: "{{ aap_content_found.integration_user | length == 0 }}"
    aap_content_integration_password: >-
      {{ (aap_content_found.integration_user.data.password | b64decode) if aap_content_found.integration_user
         else lookup('ansible.builtin.password', '/dev/null', length=aap_content_secret_length, chars=['ascii_letters', 'digits']) }}
    # The secret GitHub signs the knowledge bot's webhook deliveries with (DD34).
    aap_content_github_stream_secret_new: "{{ aap_content_found.github_stream | length == 0 }}"
    aap_content_github_stream_hmac: >-
      {{ (aap_content_found.github_stream.data.secret | b64decode) if aap_content_found.github_stream
         else lookup('ansible.builtin.password', '/dev/null', length=aap_content_secret_length, chars=['ascii_letters', 'digits']) }}
    aap_content_alert_stream_password_new: "{{ aap_content_found.alert_stream | length == 0 }}"
    aap_content_alert_stream_password: >-
      {{ (aap_content_found.alert_stream.data.password | b64decode) if aap_content_found.alert_stream
         else lookup('ansible.builtin.password', '/dev/null', length=aap_content_secret_length, chars=['ascii_letters', 'digits']) }}
  no_log: true

# The AAP 2.7 operator neither names nor sets up a decision environment, so the inventory pins one
# (demo_aap_decision_environment). If it is emptied, one already defined in EDA is reused.
- name: Read the decision environments EDA already has
  ansible.eda.decision_environment_info:
    aap_hostname: "{{ aap_content_url }}"
    aap_username: admin
    aap_password: "{{ aap_content_admin_password }}"
    aap_validate_certs: "{{ aap_content_validate_certs }}"
  register: aap_content_des
  until: aap_content_des is not failed
  retries: 3
  delay: 5
  when: aap_content_de_image_override | length == 0

- name: Choose the decision environment image
  ansible.builtin.set_fact:
    aap_content_de_candidates: >-
      {{ aap_content_des.decision_environments | default([]) | rejectattr('name', 'equalto', aap_content_de_name)
         | sort(attribute='id') | list }}

- name: Keep the chosen image
  ansible.builtin.set_fact:
    aap_content_de_image: >-
      {{ aap_content_de_image_override if aap_content_de_image_override | length > 0
         else (aap_content_de_candidates | map(attribute='image_url') | first | default('')) }}
    aap_content_de_source: >-
      {{ 'the inventory (demo_aap_decision_environment)' if aap_content_de_image_override | length > 0
         else ('EDA decision environment ' ~ (aap_content_de_candidates | map(attribute='name') | first | default('none'))) }}

- name: Stop if there is no decision environment image to use
  ansible.builtin.assert:
    that: aap_content_de_image | length > 0
    fail_msg: >-
      EDA has no decision environment to reuse, and the inventory names none. Set demo_aap_decision_environment
      to a supported decision environment image, such as
      registry.redhat.io/ansible-automation-platform-27/de-supported-rhel9 pinned by digest.
    quiet: true

- name: Store newly generated secrets in the cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ aap_content_namespace }}"
        labels:
          app.kubernetes.io/part-of: aiops-enrichment-demo
          app.kubernetes.io/component: "{{ item.component }}"
      data: "{{ dict(item.data.keys() | zip(item.data.values() | map('b64encode'))) }}"
  loop:
    - name: "{{ aap_content_eda_user_secret }}"
      component: aap-identity
      new: "{{ aap_content_eda_password_new }}"
      data:
        username: "{{ aap_content_eda_user }}"
        password: "{{ aap_content_eda_password }}"
    - name: "{{ aap_content_event_stream_secret }}"
      component: event-stream-token
      new: "{{ aap_content_stream_token_new }}"
      data:
        header: "{{ aap_content_event_stream_header }}"
        token: "{{ aap_content_stream_token }}"
    - name: "{{ aap_content_integration_eda_user_secret }}"
      component: aap-identity
      new: "{{ aap_content_integration_password_new }}"
      data:
        username: "{{ aap_content_integration_eda_user }}"
        password: "{{ aap_content_integration_password }}"
    - name: "{{ aap_content_alert_stream_secret }}"
      component: event-stream-credentials
      new: "{{ aap_content_alert_stream_password_new }}"
      data:
        username: "{{ aap_content_alert_stream_username }}"
        password: "{{ aap_content_alert_stream_password }}"
    - name: "{{ aap_content_github_stream_secret }}"
      component: event-stream-hmac
      new: "{{ aap_content_github_stream_secret_new }}"
      data:
        secret: "{{ aap_content_github_stream_hmac }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.new | bool
  no_log: true

---
# Gathers what the content needs from the cluster, declares it, applies it with
# infra.aap_configuration, then proves it (checks.yml).

- name: Gather what the content needs from the cluster
  ansible.builtin.include_tasks: gather.yml

- name: Create the diagnostics' read-only service account (DD20)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ aap_content_diagnostics_sa }}"
        namespace: "{{ aap_content_namespace }}"
        labels:
          app.kubernetes.io/part-of: aiops-enrichment-demo
          app.kubernetes.io/component: diagnostics

- name: Give the diagnostics a time-limited token for their service account
  ansible.builtin.include_tasks: diagnostics_token.yml

# DD33 and DD34: the knowledge bot, set up only once its GitHub App is in Vault (laptop setup), so a
# kit without it builds as before.
- name: Decide whether the knowledge bot is set up
  ansible.builtin.set_fact:
    aap_content_knowledge_enabled: >-
      {{ secrets_values.github_app_id | default('', true) | length > 0
         and secrets_values.github_app_private_key | default('', true) is search('PRIVATE KEY') }}

- name: Create the index refresh's service account and its time-limited token (DD34)
  ansible.builtin.include_tasks: refresh_account.yml
  when: aap_content_knowledge_enabled | bool

- name: Declare the content
  ansible.builtin.include_tasks: declare.yml

# An activation keeps the rulebook it was created with: a changed rulebook is only used by a new
# activation. So an activation whose rulebook differs from this checkout's is removed, and recreated
# below with the new one (the knowledge rule, DD33, was the first such change). Only the rules are
# compared, so an unchanged rulebook leaves its activation alone.
- name: Read the activations' rulebooks
  ansible.eda.rulebook_activation_info:
    name: "{{ item.name }}"
    aap_hostname: "{{ aap_content_url }}"
    aap_username: admin
    aap_password: "{{ aap_content_admin_password }}"
    aap_validate_certs: "{{ aap_content_validate_certs }}"
  loop:
    - { name: "{{ aap_content_activation_name }}", rulebook: "{{ aap_content_rulebook }}" }
    - { name: "{{ aap_content_integration_activation }}", rulebook: "{{ aap_content_integration_rulebook }}" }
    - { name: "{{ aap_content_refresh_activation }}", rulebook: "{{ aap_content_refresh_rulebook }}" }
  loop_control:
    label: "{{ item.name }}"
  register: aap_content_existing_activations
  until: aap_content_existing_activations is not failed
  retries: 3
  delay: 5

- name: Remove an activation whose rulebook has changed, so it is recreated with the new one
  ansible.eda.rulebook_activation:
    name: "{{ item.item.name }}"
    state: absent
    aap_hostname: "{{ aap_content_url }}"
    aap_username: admin
    aap_password: "{{ aap_content_admin_password }}"
    aap_validate_certs: "{{ aap_content_validate_certs }}"
  loop: "{{ aap_content_existing_activations.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.activations | default([]) | length > 0
    # The rules only: EDA rewrites a rulebook's sources to attach its event stream.
    - ((item.activations[0].rulebook_rulesets | default('[]', true) | from_yaml | first | default({})).rules | default([]))
      != ((lookup('ansible.builtin.file', playbook_dir ~ '/../rulebooks/' ~ item.item.rulebook) | from_yaml | first).rules)

- name: Apply the content with infra.aap_configuration
  ansible.builtin.include_role:
    name: infra.aap_configuration.dispatch
  vars:
    aap_hostname: "{{ aap_content_url }}"
    aap_username: admin
    aap_password: "{{ aap_content_admin_password }}"
    aap_validate_certs: "{{ aap_content_validate_certs }}"
    aap_organizations: "{{ aap_content_cfg_aap_organizations }}"
    controller_settings: "{{ aap_content_cfg_controller_settings }}"
    controller_credential_types: "{{ aap_content_cfg_controller_credential_types }}"
    controller_execution_environments: "{{ aap_content_cfg_controller_execution_environments }}"
    controller_projects: "{{ aap_content_cfg_controller_projects }}"
    controller_inventories: "{{ aap_content_cfg_controller_inventories }}"
    controller_hosts: "{{ aap_content_cfg_controller_hosts }}"
    controller_templates: "{{ aap_content_cfg_controller_templates }}"
    controller_workflows: "{{ aap_content_cfg_controller_workflows }}"
    controller_roles: "{{ aap_content_cfg_controller_roles }}"
    aap_user_accounts: "{{ aap_content_cfg_aap_user_accounts }}"
    controller_credentials: "{{ aap_content_cfg_controller_credentials }}"
    eda_credentials: "{{ aap_content_cfg_eda_credentials }}"
    eda_projects: "{{ aap_content_cfg_eda_projects }}"
    eda_decision_environments: "{{ aap_content_cfg_eda_decision_environments }}"
    eda_event_streams: "{{ aap_content_cfg_eda_event_streams }}"
    eda_rulebook_activations: "{{ aap_content_cfg_eda_rulebook_activations }}"
    # Hide the arguments of the roles that handle secrets, even when a task fails.
    gateway_users_secure_logging: true
    controller_configuration_credentials_secure_logging: true
    eda_configuration_credentials_secure_logging: true

- name: Wait for the project to sync and the rulebook activation to run
  ansible.builtin.include_tasks: ready.yml

- name: Prove the trigger, the workflow, the write-back and the failure branch
  ansible.builtin.include_tasks: checks.yml
  when: aap_content_checks | bool

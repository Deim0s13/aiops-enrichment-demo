---
# The activations pull their decision environment the first time, which takes a few minutes.

- name: Wait for the rulebook activations to run
  ansible.eda.rulebook_activation_info:
    name: "{{ item }}"
    aap_hostname: "{{ aap_content_url }}"
    aap_username: admin
    aap_password: "{{ aap_content_admin_password }}"
    aap_validate_certs: "{{ aap_content_validate_certs }}"
  loop: ["{{ aap_content_activation_name }}", "{{ aap_content_integration_activation }}"]
  register: aap_content_activation
  until: >-
    aap_content_activation is not failed
    and (aap_content_activation.activations | default([]) | map(attribute='status') | first | default('')) == 'running'
  retries: "{{ aap_content_ready_retries }}"
  delay: "{{ aap_content_ready_delay }}"

- name: Read the event streams' addresses
  ansible.eda.event_stream_info:
    name: "{{ item }}"
    aap_hostname: "{{ aap_content_url }}"
    aap_username: admin
    aap_password: "{{ aap_content_admin_password }}"
    aap_validate_certs: "{{ aap_content_validate_certs }}"
  loop: ["{{ aap_content_event_stream_name }}", "{{ aap_content_alert_stream_name }}"]
  register: aap_content_stream_info
  until: aap_content_stream_info is not failed
  retries: 3
  delay: 5

- name: Keep the event streams' addresses
  ansible.builtin.set_fact:
    aap_content_stream_url: "{{ aap_content_stream_info.results[0].event_streams[0].url }}"
    aap_content_alert_stream_url: "{{ aap_content_stream_info.results[1].event_streams[0].url }}"

# ServiceNow (phase 07's trigger) and Alertmanager (phase 08) read the addresses from here.
- name: Store each event stream's address beside its credentials
  kubernetes.core.k8s:
    state: patched
    api_version: v1
    kind: Secret
    name: "{{ item.name }}"
    namespace: "{{ aap_content_namespace }}"
    definition:
      data: "{{ item.data }}"
  loop:
    - name: "{{ aap_content_event_stream_secret }}"
      data:
        url: "{{ aap_content_stream_url | b64encode }}"
        header: "{{ aap_content_event_stream_header | b64encode }}"
    - name: "{{ aap_content_alert_stream_secret }}"
      data:
        url: "{{ aap_content_alert_stream_url | b64encode }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Report the content
  ansible.builtin.set_fact:
    aap_content_report:
      - "Platform: {{ aap_content_url }}; organisation {{ aap_content_organisation }}"
      - "Execution environment: {{ aap_content_ee_image }}"
      - "Decision environment: {{ aap_content_de_image }}, from {{ aap_content_de_source }}"
      - "Demo control: {{ aap_content_fault_template }}, with a survey for the single or recurring scenario"
      - "Workflow: {{ aap_content_workflow_name }} ({{ aap_content_templates.values() | join(', ') }}); launched only by {{ aap_content_eda_user }}"
      - >-
        Diagnostics: {{ aap_content_diagnostics.values() | join(', ') }}, in parallel as service account
        {{ aap_content_diagnostics_sa }}, for {{ aap_content_service_map.keys() | join(', ') }}; token
        {{ 'renewed' if aap_content_diag_token_new else 'reused' }}, expires {{ aap_content_diag_expires_at }}
      - "Trigger: activation {{ aap_content_activation_name }} running; event stream {{ aap_content_stream_url }}"
      - >-
        Integration stand-in: activation {{ aap_content_integration_activation }} running, launching only
        {{ aap_content_integration_template }} as {{ aap_content_integration_eda_user }}; event stream {{ aap_content_alert_stream_url }}
      - >-
        Generated secrets: {{ aap_content_eda_user_secret }} {{ 'created' if aap_content_eda_password_new else 'reused' }},
        {{ aap_content_event_stream_secret }} {{ 'created' if aap_content_stream_token_new else 'reused' }},
        {{ aap_content_integration_eda_user_secret }} {{ 'created' if aap_content_integration_password_new else 'reused' }},
        {{ aap_content_alert_stream_secret }} {{ 'created' if aap_content_alert_stream_password_new else 'reused' }}

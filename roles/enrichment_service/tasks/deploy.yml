---
# The service searches the knowledge index as its read-only identity, which phase 05 creates.
- name: Find the read-only knowledge identity's connection
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ enrichment_service_namespace }}"
    name: "{{ enrichment_service_knowledge_secret }}"
  register: enrichment_service_knowledge
  until: enrichment_service_knowledge is not failed
  retries: 3
  delay: 5
  no_log: true

- name: Stop if the knowledge index has not been built
  ansible.builtin.assert:
    that: enrichment_service_knowledge.resources | length > 0
    fail_msg: >-
      There is no {{ enrichment_service_knowledge_secret }} Secret in {{ enrichment_service_namespace }}, so the
      service could not search the knowledge index. Run phase 05 first.
    quiet: true

# Every request is traced in OpenShift AI's MLflow (M4.5, DD23), which phase 02 runs. The service
# writes to its own workspace, its namespace, through the in-cluster address.
- name: Find the MLflow server
  kubernetes.core.k8s_info:
    api_version: mlflow.opendatahub.io/v1
    kind: MLflow
    name: mlflow
  register: enrichment_service_mlflow_read
  until: enrichment_service_mlflow_read is not failed
  retries: 3
  delay: 5

- name: Keep the MLflow addresses
  ansible.builtin.set_fact:
    enrichment_service_mlflow: >-
      {{ {'internal': ((enrichment_service_mlflow_read.resources | first | default({})).status | default({})).address.url | default(''),
          'external': ((enrichment_service_mlflow_read.resources | first | default({})).status | default({})).url | default(''),
          'version': ((enrichment_service_mlflow_read.resources | first | default({})).status | default({})).version | default('')} }}

- name: Stop if MLflow is not running
  ansible.builtin.assert:
    that: enrichment_service_mlflow.internal | length > 0
    fail_msg: There is no MLflow server with an address, so the service could not trace its requests. Run phase 02 first.
    quiet: true

# MLflow checks each call against Kubernetes RBAC on pseudo-resources in the mlflow.kubeflow.org group,
# in the namespace that names the workspace. OpenShift AI's own integration role also allows datasets,
# registered models and its AI gateway, so the service gets a role of its own instead: experiments
# (which cover traces) only, in this namespace only, and no delete.
- name: Let the service write traces to its own MLflow workspace, and nothing else
  kubernetes.core.k8s:
    state: present
    definition:
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: "{{ enrichment_service_name }}-mlflow-traces"
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
        rules:
          - apiGroups: [mlflow.kubeflow.org]
            resources: [experiments]
            verbs: [get, list, create, update]
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: "{{ enrichment_service_name }}-mlflow-traces"
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: "{{ enrichment_service_name }}-mlflow-traces"
        subjects:
          - kind: ServiceAccount
            name: "{{ enrichment_service_service_account }}"
            namespace: "{{ enrichment_service_namespace }}"

- name: Remove the binding to OpenShift AI's broader integration role, if an earlier run made it
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    namespace: "{{ enrichment_service_namespace }}"
    name: "{{ enrichment_service_name }}-mlflow"

# Research (DD29): the vendor documentation the service may read when no approved knowledge covers a
# failure. An allow-list from the inventory; each source's site is the route phase 05 publishes.
- name: Find the enabled research sources' sites
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ item.route.namespace }}"
    name: "{{ item.route.name }}"
  loop: "{{ enrichment_service_research_enabled }}"
  loop_control:
    label: "{{ item.id }}"
  register: enrichment_service_research_routes
  until: enrichment_service_research_routes is not failed
  retries: 3
  delay: 5
  vars: &research_enabled
    enrichment_service_research_enabled: >-
      {{ enrichment_service_research_sources | selectattr('enabled', 'defined') | selectattr('enabled') | list
         if enrichment_service_research | bool else [] }}

- name: Keep each source's allow-listed site
  ansible.builtin.set_fact:
    enrichment_service_research_sources_resolved: "{{ enrichment_service_research_json | from_json }}"
  vars:
    enrichment_service_research_json: >-
      {%- set ns = namespace(out=[]) -%}
      {%- for r in enrichment_service_research_routes.results | default([]) -%}
      {%- if r.resources | default([]) | length > 0 and r.resources[0].spec.host | default('') -%}
      {%- set ns.out = ns.out + [{'id': r.item.id, 'name': r.item.name, 'services': r.item.services,
            'match': r.item.match | default([r.item.name]),
            'sitemap': 'https://' ~ r.resources[0].spec.host ~ '/' ~ r.item.sitemap_path | default('sitemap.xml')}] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.out | to_json }}

- name: Stop if an enabled research source has no site
  ansible.builtin.assert:
    that: enrichment_service_research_sources_resolved | length == enrichment_service_research_enabled | length
    fail_msg: >-
      Research source(s) {{ enrichment_service_research_enabled | map(attribute='id')
      | difference(enrichment_service_research_sources_resolved | map(attribute='id')) | join(', ') }} have no published site.
      Run phase 05 first, which publishes MessageHub's documentation, or set enabled to false in demo_research_sources.
    quiet: true
  vars: *research_enabled

- name: Deploy the service, its TLS-serving address and its network policies
  kubernetes.core.k8s:
    state: present
    definition:
      # OpenShift's service CA issues the certificate for the service's own name into this Secret.
      - apiVersion: v1
        kind: Service
        metadata:
          name: "{{ enrichment_service_name }}"
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app: "{{ enrichment_service_name }}", app.kubernetes.io/part-of: aiops-enrichment-demo }
          annotations:
            service.beta.openshift.io/serving-cert-secret-name: "{{ enrichment_service_tls_secret }}"
        spec:
          selector: { app: "{{ enrichment_service_name }}" }
          ports:
            - name: https
              port: 443
              targetPort: "{{ enrichment_service_port }}"

      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: "{{ enrichment_service_name }}"
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app: "{{ enrichment_service_name }}", app.kubernetes.io/part-of: aiops-enrichment-demo }
        spec:
          replicas: 1
          selector:
            matchLabels: { app: "{{ enrichment_service_name }}" }
          template:
            metadata:
              labels: { app: "{{ enrichment_service_name }}" }
            spec:
              serviceAccountName: "{{ enrichment_service_service_account }}"
              # No standing token: the only token the service holds is the short-lived one below, for MLflow.
              automountServiceAccountToken: false
              containers:
                - name: "{{ enrichment_service_name }}"
                  image: "{{ enrichment_service_image }}"
                  ports:
                    - name: https
                      containerPort: "{{ enrichment_service_port }}"
                  env:
                    - name: ENRICHMENT_API_TOKEN
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_token_secret }}", key: token } }
                    - name: MAAS_CONSUMER
                      value: "{{ enrichment_service_service_account }}"
                    - name: MAAS_MODEL
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_maas_secret }}", key: model } }
                    - name: MAAS_URL
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_maas_secret }}", key: url } }
                    - name: MAAS_API_KEY
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_maas_secret }}", key: api-key } }
                    - name: MAAS_REQUEST_EXTRA
                      value: "{{ enrichment_service_request_extra | to_json }}"
                    - name: ENRICHMENT_RELEVANCE_THRESHOLD
                      value: "{{ enrichment_service_relevance_threshold | string }}"
                    - name: ENRICHMENT_DOCUMENT_GATE
                      value: "{{ enrichment_service_document_gate | string }}"
                    - name: ENRICHMENT_MAX_PASSAGES
                      value: "{{ enrichment_service_max_passages | string }}"
                    - name: ENRICHMENT_EXPAND_DOCUMENTS
                      value: "{{ enrichment_service_expand_documents | string }}"
                    - name: ENRICHMENT_SKIP_SECTIONS
                      value: "{{ enrichment_service_skip_sections | join(',') }}"
                    - name: ENRICHMENT_TEMPERATURE
                      value: "{{ enrichment_service_temperature | string }}"
                    - name: ENRICHMENT_MAX_TOKENS
                      value: "{{ enrichment_service_max_tokens | string }}"
                    # Research (DD29): the allow-listed vendor documentation, its relevance floor and how
                    # many sections go to the model.
                    - name: ENRICHMENT_RESEARCH
                      value: "{{ 'on' if enrichment_service_research | bool else 'off' }}"
                    - name: ENRICHMENT_RESEARCH_SOURCES
                      value: "{{ enrichment_service_research_sources_resolved | to_json }}"
                    - name: ENRICHMENT_RESEARCH_THRESHOLD
                      value: "{{ enrichment_service_research_threshold | string }}"
                    - name: ENRICHMENT_RESEARCH_MAX_SECTIONS
                      value: "{{ enrichment_service_research_max_sections | string }}"
                    # The read-only knowledge identity (phase 05), and the service CA to verify the database.
                    - name: KNOWLEDGE_DB_HOST
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: host } }
                    - name: KNOWLEDGE_DB_PORT
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: port } }
                    - name: KNOWLEDGE_DB_NAME
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: name } }
                    - name: KNOWLEDGE_DB_USER
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: user } }
                    - name: KNOWLEDGE_DB_PASSWORD
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: password } }
                    - name: KNOWLEDGE_DB_SSLROOTCERT
                      value: /etc/pki/service-ca/service-ca.crt
                    # Tracing (DD23): MLflow's in-cluster address, verified against the service CA, signed in
                    # as the service account, in the workspace of the service's namespace.
                    - name: MLFLOW_TRACKING_URI
                      value: "{{ enrichment_service_mlflow.internal }}"
                    - name: MLFLOW_TRACKING_AUTH
                      value: kubernetes-namespaced
                    - name: MLFLOW_TRACKING_SERVER_CERT_PATH
                      value: /etc/pki/service-ca/service-ca.crt
                    - name: MLFLOW_EXPERIMENT_NAME
                      value: "{{ enrichment_service_mlflow_experiment }}"
                    - name: ENRICHMENT_TRACING
                      value: "{{ 'on' if enrichment_service_tracing | bool else 'off' }}"
                  volumeMounts:
                    - name: tls
                      mountPath: /etc/tls
                      readOnly: true
                    - name: service-ca
                      mountPath: /etc/pki/service-ca
                      readOnly: true
                    # Where MLflow's Kubernetes sign-in looks for the token and the namespace.
                    - name: mlflow-token
                      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                      readOnly: true
                  readinessProbe: &probe
                    httpGet: { path: /healthz, port: "{{ enrichment_service_port }}", scheme: HTTPS }
                    periodSeconds: 10
                  livenessProbe: *probe
                  resources: "{{ enrichment_service_resources }}"
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities: { drop: [ALL] }
                    seccompProfile: { type: RuntimeDefault }
              volumes:
                - name: tls
                  secret: { secretName: "{{ enrichment_service_tls_secret }}" }
                - name: service-ca
                  configMap: { name: openshift-service-ca.crt }
                # A token for the service account that lasts an hour and is renewed by OpenShift, and the
                # namespace, which names the MLflow workspace. Not the cluster CA: the service does not
                # call the cluster API.
                - name: mlflow-token
                  projected:
                    sources:
                      - serviceAccountToken:
                          path: token
                          expirationSeconds: "{{ enrichment_service_token_seconds }}"
                      - downwardAPI:
                          items:
                            - path: namespace
                              fieldRef: { fieldPath: metadata.namespace }

      # Nothing reaches the namespace unless a policy allows it, and only AAP's jobs may reach the service.
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-ingress
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
        spec:
          podSelector: {}
          policyTypes: [Ingress]
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-aap-to-enrichment
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
        spec:
          podSelector:
            matchLabels: { app: "{{ enrichment_service_name }}" }
          policyTypes: [Ingress]
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: "{{ enrichment_service_caller_namespace }}" }
              ports:
                - protocol: TCP
                  port: "{{ enrichment_service_port }}"

# The rollout is finished only when every pod runs the new version: a new pod that never becomes
# ready leaves the old one serving, which would otherwise pass for the new service.
- name: Wait for the rollout to finish
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ enrichment_service_namespace }}"
    name: "{{ enrichment_service_name }}"
  register: enrichment_service_deployment
  until: enrichment_service_deployment is not failed and enrichment_service_rolled_out | bool
  retries: "{{ enrichment_service_ready_retries }}"
  delay: "{{ enrichment_service_ready_delay }}"
  failed_when: false
  vars: &rolled_out
    enrichment_service_dep: "{{ enrichment_service_deployment.resources | default([]) | first | default({}) }}"
    enrichment_service_rolled_out: >-
      {{ enrichment_service_dep | length > 0
         and enrichment_service_dep.status.observedGeneration | default(0) >= enrichment_service_dep.metadata.generation
         and enrichment_service_dep.status.updatedReplicas | default(0) == enrichment_service_dep.spec.replicas
         and enrichment_service_dep.status.availableReplicas | default(0) == enrichment_service_dep.spec.replicas
         and enrichment_service_dep.status.replicas | default(0) == enrichment_service_dep.spec.replicas }}

- name: Explain a rollout that did not finish
  when: not (enrichment_service_rolled_out | bool)
  vars: *rolled_out
  block:
    - name: Read the service's pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ enrichment_service_namespace }}"
        label_selectors: ["app={{ enrichment_service_name }}"]
      register: enrichment_service_pods

    - name: Stop, saying what the newest pod is doing
      ansible.builtin.fail:
        msg: >-
          The new version of the service did not become ready, so the previous version may still be serving.
          Newest pod {{ newest.metadata.name | default('none') }}: phase {{ newest.status.phase | default('unknown') }}
          {%- if waiting %}, waiting: {{ waiting.reason | default('') }} {{ waiting.message | default('') | truncate(200) }}{% endif %}
          {%- if last %}, last ended: {{ last.reason | default('') }} (exit {{ last.exitCode | default('?') }}){% endif %}
          {%- if newest.status.conditions is defined %}, {{ newest.status.conditions | selectattr('status', 'equalto', 'False')
              | map(attribute='message') | select | first | default('') | truncate(200) }}{% endif %}.
          Its log: oc logs -n {{ enrichment_service_namespace }} {{ newest.metadata.name | default('') }}
      vars:
        newest: "{{ enrichment_service_pods.resources | sort(attribute='metadata.creationTimestamp') | last | default({}) }}"
        container: "{{ newest.status.containerStatuses | default([]) | first | default({}) }}"
        waiting: "{{ (container.state | default({})).waiting | default({}) }}"
        last: "{{ (container.lastState | default({})).terminated | default({}) }}"

- name: Report the service
  ansible.builtin.set_fact:
    enrichment_service_report:
      - >-
        Image: {{ 'built from commit ' ~ enrichment_service_commit[:12] if enrichment_service_built else
                  'already built for commit ' ~ enrichment_service_commit[:12] }}; {{ enrichment_service_image }}
      - "Service: {{ enrichment_service_url }}, TLS from the service CA; callers only from {{ enrichment_service_caller_namespace }}"
      - >-
        Research (DD29): {{ (enrichment_service_research_sources_resolved | map(attribute='name')
        | zip(enrichment_service_research_sources_resolved | map(attribute='sitemap')) | map('join', ' at ') | join('; '))
        if enrichment_service_research_sources_resolved | length > 0 else 'off, no sources enabled' }}; floor
        {{ enrichment_service_research_threshold }}, at most {{ enrichment_service_research_max_sections }} sections
      - >-
        API token: {{ 'generated' if enrichment_service_token_new else 'reused' }}, in
        {{ enrichment_service_namespace }}/{{ enrichment_service_token_secret }} and
        {{ enrichment_service_caller_namespace }}/{{ enrichment_service_token_secret }}

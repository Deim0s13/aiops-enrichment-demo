---
# The service searches the knowledge index as its read-only identity, which phase 05 creates.
- name: Find the read-only knowledge identity's connection
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ enrichment_service_namespace }}"
    name: "{{ enrichment_service_knowledge_secret }}"
  register: enrichment_service_knowledge
  no_log: true

- name: Stop if the knowledge index has not been built
  ansible.builtin.assert:
    that: enrichment_service_knowledge.resources | length > 0
    fail_msg: >-
      There is no {{ enrichment_service_knowledge_secret }} Secret in {{ enrichment_service_namespace }}, so the
      service could not search the knowledge index. Run phase 05 first.
    quiet: true

- name: Deploy the service, its TLS-serving address and its network policies
  kubernetes.core.k8s:
    state: present
    definition:
      # OpenShift's service CA issues the certificate for the service's own name into this Secret.
      - apiVersion: v1
        kind: Service
        metadata:
          name: "{{ enrichment_service_name }}"
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app: "{{ enrichment_service_name }}", app.kubernetes.io/part-of: aiops-enrichment-demo }
          annotations:
            service.beta.openshift.io/serving-cert-secret-name: "{{ enrichment_service_tls_secret }}"
        spec:
          selector: { app: "{{ enrichment_service_name }}" }
          ports:
            - name: https
              port: 443
              targetPort: "{{ enrichment_service_port }}"

      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: "{{ enrichment_service_name }}"
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app: "{{ enrichment_service_name }}", app.kubernetes.io/part-of: aiops-enrichment-demo }
        spec:
          replicas: 1
          selector:
            matchLabels: { app: "{{ enrichment_service_name }}" }
          template:
            metadata:
              labels: { app: "{{ enrichment_service_name }}" }
            spec:
              serviceAccountName: "{{ enrichment_service_service_account }}"
              # The service needs no access to the cluster API.
              automountServiceAccountToken: false
              containers:
                - name: "{{ enrichment_service_name }}"
                  image: "{{ enrichment_service_image }}"
                  ports:
                    - name: https
                      containerPort: "{{ enrichment_service_port }}"
                  env:
                    - name: ENRICHMENT_API_TOKEN
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_token_secret }}", key: token } }
                    - name: MAAS_CONSUMER
                      value: "{{ enrichment_service_service_account }}"
                    - name: MAAS_MODEL
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_maas_secret }}", key: model } }
                    - name: MAAS_URL
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_maas_secret }}", key: url } }
                    - name: MAAS_API_KEY
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_maas_secret }}", key: api-key } }
                    - name: MAAS_REQUEST_EXTRA
                      value: "{{ enrichment_service_request_extra | to_json }}"
                    - name: ENRICHMENT_RELEVANCE_THRESHOLD
                      value: "{{ enrichment_service_relevance_threshold | string }}"
                    - name: ENRICHMENT_MAX_PASSAGES
                      value: "{{ enrichment_service_max_passages | string }}"
                    - name: ENRICHMENT_TEMPERATURE
                      value: "{{ enrichment_service_temperature | string }}"
                    - name: ENRICHMENT_MAX_TOKENS
                      value: "{{ enrichment_service_max_tokens | string }}"
                    # The read-only knowledge identity (phase 05), and the service CA to verify the database.
                    - name: KNOWLEDGE_DB_HOST
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: host } }
                    - name: KNOWLEDGE_DB_PORT
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: port } }
                    - name: KNOWLEDGE_DB_NAME
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: name } }
                    - name: KNOWLEDGE_DB_USER
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: user } }
                    - name: KNOWLEDGE_DB_PASSWORD
                      valueFrom: { secretKeyRef: { name: "{{ enrichment_service_knowledge_secret }}", key: password } }
                    - name: KNOWLEDGE_DB_SSLROOTCERT
                      value: /etc/pki/service-ca/service-ca.crt
                  volumeMounts:
                    - name: tls
                      mountPath: /etc/tls
                      readOnly: true
                    - name: service-ca
                      mountPath: /etc/pki/service-ca
                      readOnly: true
                  readinessProbe: &probe
                    httpGet: { path: /healthz, port: "{{ enrichment_service_port }}", scheme: HTTPS }
                    periodSeconds: 10
                  livenessProbe: *probe
                  resources: "{{ enrichment_service_resources }}"
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities: { drop: [ALL] }
                    seccompProfile: { type: RuntimeDefault }
              volumes:
                - name: tls
                  secret: { secretName: "{{ enrichment_service_tls_secret }}" }
                - name: service-ca
                  configMap: { name: openshift-service-ca.crt }

      # Nothing reaches the namespace unless a policy allows it, and only AAP's jobs may reach the service.
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: default-deny-ingress
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
        spec:
          podSelector: {}
          policyTypes: [Ingress]
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: allow-aap-to-enrichment
          namespace: "{{ enrichment_service_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
        spec:
          podSelector:
            matchLabels: { app: "{{ enrichment_service_name }}" }
          policyTypes: [Ingress]
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels: { kubernetes.io/metadata.name: "{{ enrichment_service_caller_namespace }}" }
              ports:
                - protocol: TCP
                  port: "{{ enrichment_service_port }}"

# The rollout is finished only when every pod runs the new version: a new pod that never becomes
# ready leaves the old one serving, which would otherwise pass for the new service.
- name: Wait for the rollout to finish
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ enrichment_service_namespace }}"
    name: "{{ enrichment_service_name }}"
  register: enrichment_service_deployment
  until: enrichment_service_deployment is not failed and enrichment_service_rolled_out | bool
  retries: "{{ enrichment_service_ready_retries }}"
  delay: "{{ enrichment_service_ready_delay }}"
  failed_when: false
  vars: &rolled_out
    enrichment_service_dep: "{{ enrichment_service_deployment.resources | default([]) | first | default({}) }}"
    enrichment_service_rolled_out: >-
      {{ enrichment_service_dep | length > 0
         and enrichment_service_dep.status.observedGeneration | default(0) >= enrichment_service_dep.metadata.generation
         and enrichment_service_dep.status.updatedReplicas | default(0) == enrichment_service_dep.spec.replicas
         and enrichment_service_dep.status.availableReplicas | default(0) == enrichment_service_dep.spec.replicas
         and enrichment_service_dep.status.replicas | default(0) == enrichment_service_dep.spec.replicas }}

- name: Explain a rollout that did not finish
  when: not (enrichment_service_rolled_out | bool)
  vars: *rolled_out
  block:
    - name: Read the service's pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ enrichment_service_namespace }}"
        label_selectors: ["app={{ enrichment_service_name }}"]
      register: enrichment_service_pods

    - name: Stop, saying what the newest pod is doing
      ansible.builtin.fail:
        msg: >-
          The new version of the service did not become ready, so the previous version may still be serving.
          Newest pod {{ newest.metadata.name | default('none') }}: phase {{ newest.status.phase | default('unknown') }}
          {%- if waiting %}, waiting: {{ waiting.reason | default('') }} {{ waiting.message | default('') | truncate(200) }}{% endif %}
          {%- if last %}, last ended: {{ last.reason | default('') }} (exit {{ last.exitCode | default('?') }}){% endif %}
          {%- if newest.status.conditions is defined %}, {{ newest.status.conditions | selectattr('status', 'equalto', 'False')
              | map(attribute='message') | select | first | default('') | truncate(200) }}{% endif %}.
          Its log: oc logs -n {{ enrichment_service_namespace }} {{ newest.metadata.name | default('') }}
      vars:
        newest: "{{ enrichment_service_pods.resources | sort(attribute='metadata.creationTimestamp') | last | default({}) }}"
        container: "{{ newest.status.containerStatuses | default([]) | first | default({}) }}"
        waiting: "{{ (container.state | default({})).waiting | default({}) }}"
        last: "{{ (container.lastState | default({})).terminated | default({}) }}"

- name: Report the service
  ansible.builtin.set_fact:
    enrichment_service_report:
      - >-
        Image: {{ 'built from commit ' ~ enrichment_service_commit[:12] if enrichment_service_built else
                  'already built for commit ' ~ enrichment_service_commit[:12] }}; {{ enrichment_service_image }}
      - "Service: {{ enrichment_service_url }}, TLS from the service CA; callers only from {{ enrichment_service_caller_namespace }}"
      - >-
        API token: {{ 'generated' if enrichment_service_token_new else 'reused' }}, in
        {{ enrichment_service_namespace }}/{{ enrichment_service_token_secret }} and
        {{ enrichment_service_caller_namespace }}/{{ enrichment_service_token_secret }}

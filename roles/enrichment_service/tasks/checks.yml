---
# The service has no route, so it is checked from inside the cluster: a Job in the caller's
# namespace, with the service CA and the token, and a Job in a namespace the policy must refuse.

- name: Name this run's check Jobs
  ansible.builtin.set_fact:
    enrichment_service_check_run: "enrichment-check-{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}"

- name: Run the check Jobs
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "{{ enrichment_service_check_run }}-{{ item.key }}"
        namespace: "{{ item.namespace }}"
        labels: { app.kubernetes.io/part-of: aiops-enrichment-demo, app.kubernetes.io/component: build-check }
      spec:
        backoffLimit: 0
        ttlSecondsAfterFinished: 600
        template:
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            containers:
              - name: check
                image: "{{ enrichment_service_check_image }}"
                command: [python3, -c, "{{ lookup('ansible.builtin.template', item.script) }}"]
                env: "{{ item.env }}"
                volumeMounts: "{{ item.mounts }}"
                resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities: { drop: [ALL] }
                  seccompProfile: { type: RuntimeDefault }
            volumes: "{{ item.volumes }}"
  loop:
    - key: caller
      namespace: "{{ enrichment_service_caller_namespace }}"
      script: check_caller.py.j2
      env:
        - { name: URL, value: "{{ enrichment_service_url }}" }
        - { name: RESEARCH, value: "{{ '1' if enrichment_service_research_sources_resolved | length > 0 else '0' }}" }
        - name: TOKEN
          valueFrom: { secretKeyRef: { name: "{{ enrichment_service_token_secret }}", key: token } }
      # OpenShift publishes the service CA bundle in every namespace as this ConfigMap.
      mounts: [{ name: ca, mountPath: /etc/ca, readOnly: true }]
      volumes: [{ name: ca, configMap: { name: openshift-service-ca.crt } }]
    - key: refused
      namespace: "{{ enrichment_service_refused_namespace }}"
      script: check_refused.py.j2
      env: []
      mounts: []
      volumes: []
  loop_control:
    label: "{{ item.key }} ({{ item.namespace }})"

- name: Wait for the check Jobs to finish
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ item.namespace }}"
    name: "{{ enrichment_service_check_run }}-{{ item.key }}"
  loop:
    - { key: caller, namespace: "{{ enrichment_service_caller_namespace }}" }
    - { key: refused, namespace: "{{ enrichment_service_refused_namespace }}" }
  loop_control:
    label: "{{ item.key }}"
  register: enrichment_service_jobs
  until: >-
    enrichment_service_jobs is not failed
    and ((enrichment_service_jobs.resources | first | default({})).status | default({})).succeeded | default(0)
        + ((enrichment_service_jobs.resources | first | default({})).status | default({})).failed | default(0) >= 1
  # Each call with the token waits for the model and the citation check, up to ten minutes.
  retries: 250
  delay: 5
  no_log: true

- name: Read what each check Job printed
  kubernetes.core.k8s_log:
    namespace: "{{ item.namespace }}"
    label_selectors: ["job-name={{ enrichment_service_check_run }}-{{ item.key }}"]
  loop:
    - { key: caller, namespace: "{{ enrichment_service_caller_namespace }}" }
    - { key: refused, namespace: "{{ enrichment_service_refused_namespace }}" }
  loop_control:
    label: "{{ item.key }}"
  register: enrichment_service_logs
  no_log: true

- name: Keep only the results
  ansible.builtin.set_fact:
    enrichment_service_caller: "{{ (enrichment_service_logs.results[0].log_lines | select | last | default('{}')) | from_json }}"
    enrichment_service_refused: "{{ (enrichment_service_logs.results[1].log_lines | select | last | default('{}')) | from_json }}"

- name: Remove the check Jobs
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ item.namespace }}"
    name: "{{ enrichment_service_check_run }}-{{ item.key }}"
    delete_options:
      propagationPolicy: Background
  loop:
    - { key: caller, namespace: "{{ enrichment_service_caller_namespace }}" }
    - { key: refused, namespace: "{{ enrichment_service_refused_namespace }}" }
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

# Proved from MLflow itself, not from the service's answer: the trace is read back through MLflow's
# external address as the build's own identity, its tags checked, and its spans searched for the card
# number the request carried.
- name: Read the check's trace back from MLflow
  ansible.builtin.uri:
    url: "{{ enrichment_service_mlflow.external }}/{{ item }}"
    headers:
      Authorization: "Bearer {{ secrets_values.cluster_api_token }}"
      X-MLFLOW-WORKSPACE: "{{ enrichment_service_namespace }}"
    validate_certs: "{{ enrichment_service_validate_certs }}"
    return_content: true
    status_code: [200, 400, 401, 403, 404, 500, 502, 503]
  loop:
    - "api/3.0/mlflow/traces/{{ enrichment_service_caller.trace_id }}"
    - "ajax-api/3.0/mlflow/get-trace-artifact?request_id={{ enrichment_service_caller.trace_id }}"
  register: enrichment_service_trace_read
  when: enrichment_service_caller.trace_recorded | default(false) | bool
  no_log: true

- name: Keep only what the checks need from the trace
  ansible.builtin.set_fact:
    enrichment_service_trace:
      read: "{{ enrichment_service_trace_read.results | default([]) | map(attribute='status', default=-1) | list }}"
      tags: "{{ (((enrichment_service_trace_read.results | default([{}]))[0].json | default({})).trace | default({})).trace_info.tags | default({}) }}"
      # MLflow serves the spans as a file, not as JSON.
      spans: >-
        {{ (enrichment_service_trace_spans | from_json).spans | default([]) | map(attribute='name') | list
           if (enrichment_service_trace_spans | trim).startswith('{') else [] }}
      card: "{{ '4111' in enrichment_service_trace_spans }}"
  vars:
    enrichment_service_trace_spans: "{{ (enrichment_service_trace_read.results | default([{}, {}]))[1].content | default('', true) }}"
  no_log: true

# The drafted resolution (DD33) is checked with the same check GitHub runs on a knowledge pull request.
- name: Write the drafted resolution where the template check can read it
  ansible.builtin.tempfile:
    state: directory
  register: enrichment_service_draft_dir
  when: enrichment_service_caller.draft.markdown | default('') | length > 0

- name: Put the draft in a file under its own name
  ansible.builtin.copy:
    content: "{{ enrichment_service_caller.draft.markdown }}"
    dest: "{{ enrichment_service_draft_dir.path }}/{{ enrichment_service_caller.draft.filename | basename }}"
    mode: "0600"
  when: enrichment_service_draft_dir is not skipped

- name: Check the draft against the template
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ enrichment_service_source }}/../../tools/knowledge/check.py"
      - "{{ enrichment_service_draft_dir.path }}/{{ enrichment_service_caller.draft.filename | basename }}"
  register: enrichment_service_draft_check
  changed_when: false
  failed_when: false
  when: enrichment_service_draft_dir is not skipped

# The versions this checkout says the service is at, to compare with what answered: phase 06 builds
# from main on GitHub, so a difference means the change was not pushed, or the build did not run.
- name: Read the versions in this checkout
  ansible.builtin.set_fact:
    enrichment_service_local_versions:
      service: "{{ lookup('ansible.builtin.file', enrichment_service_source ~ '/app/main.py') | regex_search(pattern % 'SERVICE', '\\1') | first }}"
      prompt: "{{ lookup('ansible.builtin.file', enrichment_service_source ~ '/app/prompt.py') | regex_search(pattern % 'PROMPT', '\\1') | first }}"
      policy: "{{ lookup('ansible.builtin.file', enrichment_service_source ~ '/app/policy.py') | regex_search(pattern % 'POLICY', '\\1') | first }}"
  vars:
    pattern: '%s_VERSION = "([^"]+)"'

- name: Judge each check
  ansible.builtin.set_fact:
    enrichment_service_results:
      - check: the running service is the version in this checkout
        passed: >-
          {{ enrichment_service_caller.service_version | default('') == enrichment_service_local_versions.service
             and enrichment_service_caller.prompt_version | default('') == enrichment_service_local_versions.prompt
             and enrichment_service_caller.policy_version | default('') == enrichment_service_local_versions.policy }}
        detail: >-
          running service {{ enrichment_service_caller.service_version | default('none') }},
          {{ enrichment_service_caller.prompt_version | default('none') }}, {{ enrichment_service_caller.policy_version | default('none') }};
          this checkout {{ enrichment_service_local_versions.service }}, {{ enrichment_service_local_versions.prompt }},
          {{ enrichment_service_local_versions.policy }}{{ '' if enrichment_service_caller.prompt_version | default('')
          == enrichment_service_local_versions.prompt and enrichment_service_caller.service_version | default('')
          == enrichment_service_local_versions.service else '. Phase 06 builds from main on GitHub: push the change and run phase 06 again' }}
      - check: the service answers over TLS from the service CA
        passed: "{{ enrichment_service_caller.health | default(-1) == 200 }}"
        detail: >-
          HTTP {{ enrichment_service_caller.health | default('none')
          }}{{ (', ' ~ enrichment_service_caller.error) if enrichment_service_caller.error | default(none) else '' }}
      - check: a call without the token is refused
        passed: "{{ enrichment_service_caller.no_token | default(-1) == 401 }}"
        detail: "HTTP {{ enrichment_service_caller.no_token | default('none') }}"
      - check: a call with the token gets a response in the design 5.3 shape, from the knowledge index and the model
        passed: >-
          {{ enrichment_service_caller.with_token | default(-1) == 200
             and enrichment_service_caller.status | default('') in ['enriched', 'insufficient_evidence']
             and ['gaps', 'likely_causes', 'manual_review_required', 'next_steps', 'provenance', 'recommended_job', 'status', 'summary']
                 | difference(enrichment_service_caller['keys'] | default([])) | length == 0
             and enrichment_service_caller.candidates | default([]) | length > 0
             and enrichment_service_caller.tokens.completion | default(0) > 0 }}
        detail: >-
          HTTP {{ enrichment_service_caller.with_token | default('none') }}, status {{ enrichment_service_caller.status | default('none') }},
          prompt {{ enrichment_service_caller.prompt_version | default('none') }};
          best matches {{ enrichment_service_caller.candidates | default([]) | map(attribute='id')
                          | zip(enrichment_service_caller.candidates | default([]) | map(attribute='score')) | map('join', ' ') | join(', ') or 'none' }};
          {{ enrichment_service_caller.source_ids | default([]) | length }} passage(s) above the threshold sent to the model;
          {{ enrichment_service_caller.tokens.prompt | default(0) }}+{{ enrichment_service_caller.tokens.completion | default(0) }} tokens
          {{- ('; ' ~ enrichment_service_caller.detail) if enrichment_service_caller.detail | default('') else '' }}
      - check: a card number in the evidence is redacted, and never comes back
        passed: >-
          {{ enrichment_service_caller.with_token | default(-1) == 200
             and enrichment_service_caller.redactions.card | default(0) == 1
             and not enrichment_service_caller.card_returned | default(true) }}
        detail: >-
          redacted: {{ enrichment_service_caller.redactions | default({}) | dict2items
                       | map(attribute='key') | zip(enrichment_service_caller.redactions | default({}) | dict2items | map(attribute='value'))
                       | map('join', ' ') | join(', ') or 'nothing' }};
          returned: {{ 'yes' if enrichment_service_caller.card_returned | default(true) else 'no' }}
      - check: the call is traced in MLflow, step by step, with no card number in the trace
        passed: >-
          {{ enrichment_service_caller.trace_recorded | default(false) | bool
             and enrichment_service_trace.read == [200, 200]
             and enrichment_service_trace.tags.incident | default('') == 'INC0000000'
             and enrichment_service_trace.tags.prompt_version | default('') == enrichment_service_caller.prompt_version | default('none')
             and ['sanitise', 'retrieve', 'model', 'check'] | difference(enrichment_service_trace.spans) | length == 0
             and not enrichment_service_trace.card | bool }}
        detail: >-
          {{ ('trace ' ~ enrichment_service_caller.trace_id ~ ' in experiment ' ~ enrichment_service_mlflow_experiment
              ~ ', read back HTTP ' ~ enrichment_service_trace.read | join(' and ') ~ '; steps '
              ~ (enrichment_service_trace.spans | join(', ') or 'none') ~ '; card number in trace: '
              ~ ('yes' if enrichment_service_trace.card | bool else 'no'))
             if enrichment_service_caller.trace_recorded | default(false) | bool
             else 'not recorded: the service could not write to MLflow; see oc logs -n ' ~ enrichment_service_namespace
                  ~ ' deploy/' ~ enrichment_service_name ~ ' | grep -i mlflow' }}
      - check: every claim in the answer is checked against the sources it cites, by a second model call (DD31)
        passed: "{{ not enrichment_service_review | bool or enrichment_service_caller.review.status | default('') == 'checked' }}"
        detail: >-
          {{ enrichment_service_caller.review.status | default('none') }}: {{ enrichment_service_caller.review.claims | default(0) }} claim(s),
          {{ enrichment_service_caller.review.supported | default(0) }} supported, {{ enrichment_service_caller.review.partly | default(0) }} partly,
          {{ enrichment_service_caller.review.removed | default(0) }} removed; suggestions against the documented steps (report only):
          {{ enrichment_service_caller.repeats | default([]) | map(attribute='score') | map('string') | join(', ') or 'none compared' }};
          model calls {{ enrichment_service_caller.seconds | default({}) | dict2items | map(attribute='key')
                         | zip(enrichment_service_caller.seconds | default({}) | dict2items | map(attribute='value') | map(attribute='seconds'))
                         | map('join', ' ') | join(' s, ') }} s
      - check: a resolution is drafted from an engineer's notes in the template's layout, by the check GitHub runs (DD33)
        passed: "{{ enrichment_service_caller.draft.status | default(-1) == 200 and enrichment_service_draft_check.rc | default(1) == 0 }}"
        detail: >-
          HTTP {{ enrichment_service_caller.draft.status | default('none') }};
          {{ (enrichment_service_draft_check.stdout_lines | default([enrichment_service_caller.draft.detail | default('not drafted')]))
             | join('; ') }}; sections from
          {{ enrichment_service_caller.draft.sections | default([]) | map(attribute='source') | join(', ') or 'none' }};
          {{ enrichment_service_caller.draft.unsupported | default(0) }} not supported by the source they claim
      - check: a failure no approved knowledge covers is researched in the allow-listed vendor documentation (DD29)
        passed: >-
          {{ enrichment_service_research_sources_resolved | length == 0
             or (enrichment_service_caller.research.status | default(-1) == 200
                 and enrichment_service_caller.research.used | default([]) | length > 0) }}
        detail: >-
          {{ ('HTTP ' ~ enrichment_service_caller.research.status | default('none') ~ '; documentation used '
              ~ (enrichment_service_caller.research.used | default([]) | map(attribute='id')
                 | zip(enrichment_service_caller.research.used | default([]) | map(attribute='score')) | map('join', ' ') | join(', ') or 'none')
              ~ '; ' ~ enrichment_service_caller.research.researched_fixes | default(0) ~ ' researched fix(es)'
              ~ ((': ' ~ enrichment_service_caller.research.notes | join(' ')) if enrichment_service_caller.research.notes | default([]) else '')
              ~ (('; ' ~ enrichment_service_caller.research.detail) if enrichment_service_caller.research.detail | default('') else ''))
             if enrichment_service_research_sources_resolved | length > 0 else 'no research sources are enabled, so not checked' }}
      - check: "a namespace other than {{ enrichment_service_caller_namespace }} cannot reach the service"
        passed: "{{ enrichment_service_refused.connect | default('open') != 'open' }}"
        detail: "from {{ enrichment_service_refused_namespace }}: {{ enrichment_service_refused.connect | default('no result') }}"

- name: Report the checks
  ansible.builtin.set_fact:
    enrichment_service_report: "{{ enrichment_service_report + (enrichment_service_check_lines | from_json) }}"
  vars:
    enrichment_service_check_lines: >-
      {%- set ns = namespace(lines=[]) -%}
      {%- for c in enrichment_service_results -%}
      {%- set ns.lines = ns.lines + [('Check passed: ' if c.passed | bool else 'CHECK FAILED: ') ~ c.check ~ ' (' ~ c.detail | trim ~ ')'] -%}
      {%- endfor -%}
      {{ ns.lines | to_json }}

- name: Stop if a check failed
  ansible.builtin.assert:
    that: enrichment_service_results | map(attribute='passed') | map('bool') | reject | list | length == 0
    fail_msg: "{{ enrichment_service_report | select('match', 'CHECK FAILED') | join('; ') }}"
    quiet: true

---
- name: Build the image in the cluster, if the service's source has changed
  ansible.builtin.include_role:
    name: incluster_build
  vars:
    incluster_build_name: "{{ enrichment_service_name }}"
    incluster_build_namespace: "{{ enrichment_service_namespace }}"
    incluster_build_context_dir: "{{ enrichment_service_context_dir }}"
    incluster_build_repository: "{{ enrichment_service_repository }}"
    incluster_build_git_secret: "{{ enrichment_service_git_secret }}"

- name: Keep the image, pinned by digest
  ansible.builtin.set_fact:
    enrichment_service_image: "{{ incluster_build_image }}"
    enrichment_service_commit: "{{ incluster_build_commit }}"
    enrichment_service_built: "{{ incluster_build_built }}"

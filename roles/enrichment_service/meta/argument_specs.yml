---
argument_specs:
  main:
    short_description: Build, deploy and check the enrichment service
    description:
      - Builds the image in the cluster from the repository's services/enrichment directory, only when that
        directory has changed, and deploys it pinned by digest.
      - TLS from OpenShift's service CA, its own API token (also copied to the AAP namespace for phase 07),
        its Models-as-a-Service key from phase 02, and network policies that admit only AAP's jobs.
      - Checks it from inside the cluster, from the AAP namespace and from a namespace that must be refused.
      - Reads the cluster and source secrets from secrets_values.
    options:
      enrichment_service_namespace:
        type: str
        required: true
        description: Namespace of the service; phase 02 created it with the service account and MaaS key.
      enrichment_service_service_account:
        type: str
        required: true
        description: The service's own service account, which Models-as-a-Service knows (phase 02).
      enrichment_service_maas_secret:
        type: str
        required: true
        description: Secret holding the service's MaaS key, model ID and URL (phase 02).
      enrichment_service_caller_namespace:
        type: str
        required: true
        description: The only namespace allowed to call the service; AAP runs its jobs there.
      enrichment_service_refused_namespace:
        type: str
        required: true
        description: A namespace the network policy must refuse, used by the checks.
      enrichment_service_repository:
        type: dict
        required: true
        description: The repository to build from, with url, owner, name and branch.
      enrichment_service_knowledge_secret:
        type: str
        description: Secret holding the read-only knowledge identity's connection, from phase 05.
      enrichment_service_relevance_threshold:
        type: float
        description: Passages scoring below this are not sent to the model (design 5.3, rule 5).
      enrichment_service_document_gate:
        type: float
        description: A document reaches the model only if it scores at least this against the incident's description alone (DD27).
      enrichment_service_max_passages:
        type: int
        description: The most passages sent to the model for one incident.
      enrichment_service_expand_documents:
        type: int
        description: How many documents of each type (runbook, resolution) bring their actionable sections with them.
      enrichment_service_skip_sections:
        type: list
        elements: str
        description: Section headings, by prefix, that are not searched because they describe a document rather than say what to do.
      enrichment_service_temperature:
        type: float
        description: The model's sampling temperature.
      enrichment_service_max_tokens:
        type: int
        description: The most tokens the model may write in its answer.
      enrichment_service_request_extra:
        type: dict
        description: Model-specific fields added to every model request, such as Qwen3's thinking switch.
      enrichment_service_tracing:
        type: bool
        description: Trace every request in MLflow (best effort).
      enrichment_service_mlflow_experiment:
        type: str
        description: The MLflow experiment traces are written to, in the workspace of the service's namespace.
      enrichment_service_token_seconds:
        type: int
        description: Lifetime of the service account token used to sign in to MLflow; OpenShift renews it.
      enrichment_service_validate_certs:
        type: bool
        description: Verify the certificate of MLflow's external address when the checks read a trace back.
      enrichment_service_research:
        type: bool
        description: Let the service research allow-listed vendor documentation when no approved knowledge covers a failure (DD29).
      enrichment_service_research_sources:
        type: list
        elements: dict
        description: >-
          The allow-list, from demo_research_sources: each with id, name, services, match, enabled, and the route
          (namespace and name) that publishes its site.
      enrichment_service_research_threshold:
        type: float
        description: The relevance floor for a documentation section to reach the model.
      enrichment_service_research_max_sections:
        type: int
        description: The most documentation sections sent to the model.
      enrichment_service_research_per_page:
        type: int
        description: The most documentation sections from one page.
      enrichment_service_review:
        type: bool
        description: Check every claim against the sources it cites with a second model call (DD31).
      enrichment_service_repeat_threshold:
        type: float
        description: A suggestion scoring at least this against a documented step is dropped as a repeat.
      enrichment_service_model_timeout:
        type: int
        description: Seconds each model call may take.
      enrichment_service_thinking:
        type: bool
        description: Switch on the model's thinking mode, with enrichment_service_request_extra_thinking in place of request_extra.
      enrichment_service_request_extra_thinking:
        type: dict
        description: The model request fields that switch its thinking mode on, from demo_model.request_extra_thinking.
      enrichment_service_thinking_tokens:
        type: int
        description: Extra room in each answer for the model's reasoning when thinking is on.
      enrichment_service_checks:
        type: bool
        description: Check the service from inside the cluster.

---
# Phase 06: the enrichment service, built in the cluster from this repository (DD08) and deployed
# behind TLS from OpenShift's service CA, with its own API token, reachable only from AAP's jobs.
enrichment_service_name: enrichment
enrichment_service_context_dir: services/enrichment
enrichment_service_port: 8443
enrichment_service_token_secret: enrichment-api-token
enrichment_service_tls_secret: enrichment-tls
enrichment_service_git_secret: enrichment-git-source
enrichment_service_token_length: 40
# The embedding model runs in the process (DD21), so the service needs more memory than the skeleton did.
enrichment_service_resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }

# Enrichment (M4.4). The read-only knowledge identity's connection, from phase 05.
enrichment_service_knowledge_secret: knowledge-reader-db
# Passages scoring below this are not sent to the model; with none above it, the answer can only be
# insufficient_evidence (design 5.3, rule 5). Set from measurement (2026-10-28, M4.7): with navigation
# sections skipped and the service's name left out, a throttling question no document answers scored
# 0.70 at best, the phase 06 check's sparse memory-fault request 0.79 and the full memory question
# 0.87. Phase 05 reports the first and last on every build, so a drift shows.
enrichment_service_relevance_threshold: 0.75
# The document gate (DD27): a document reaches the model only if it scores at least this against the
# incident's description alone. Measured (2026-10-29): the memory fault's description 0.79, the
# throttling fault's 0.65 at best. Phase 05 reports both on every build.
enrichment_service_document_gate: 0.72
# The best-matching passages sent, and how many documents of each type bring their actionable sections
# with them: the best runbook its Diagnosis and Actions, the best resolution its Root cause and
# Resolution (DD24).
enrichment_service_max_passages: 5
enrichment_service_expand_documents: 1
# Sections that describe a document rather than say what to do are not searched (DD24).
# Service overview describes the service: the memory runbook's mentions MessageHub, which made it look
# relevant to the throttling fault (S2, DD26).
enrichment_service_skip_sections: [Purpose, Scope, Service overview, Related documents, Change history, Timeline]
enrichment_service_temperature: 0.2
# Room for the documented fix and the model's suggestions, now with steps; an answer cut off at the
# limit is refused.
enrichment_service_max_tokens: 2000
# Research (DD29): when no approved knowledge covers a failure, the service may read the vendor
# documentation of a dependency the evidence names, from this allow-list (the inventory's
# demo_research_sources). Sections are ranked with the knowledge's embedding model; those at or above
# the floor, at most this many, go to the model. Not yet calibrated against the real model: phase 06
# reports the scores of its research check.
enrichment_service_research: true
enrichment_service_research_sources: []
enrichment_service_research_threshold: 0.60
# Six sections, at most two from one page, so one page cannot crowd out the rest (DD32).
enrichment_service_research_max_sections: 6
enrichment_service_research_per_page: 2
# The citation check (DD31): a second model call checks every claim against the sources it cites.
enrichment_service_review: true
# A suggestion that scores at least this against a documented step repeats it, and is dropped (DD32).
# Provisional: phase 06 reports the scores of its memory request.
enrichment_service_repeat_threshold: 0.85
# Accuracy over speed (DD32): each model call may take this long. The workflow's call to the service
# waits up to ten minutes.
enrichment_service_model_timeout: 300
# The model's thinking mode, before it answers: off by default, to compare notes with it on and off.
# When on, the request takes demo_model.request_extra_thinking in place of request_extra, and the
# answer gets this much more room for the reasoning.
enrichment_service_thinking: false
enrichment_service_request_extra_thinking: {}
enrichment_service_thinking_tokens: 6000
# Tracing (M4.5, DD23): every request is traced in OpenShift AI's MLflow, in this experiment in the
# workspace of the service's namespace. Best effort: if MLflow is down, enrichment carries on and the
# note says the trace was not recorded.
enrichment_service_tracing: true
enrichment_service_mlflow_experiment: aiops-enrichment
# The lifetime of the service account token MLflow sign-in uses; OpenShift renews it before it expires.
enrichment_service_token_seconds: 3600
enrichment_service_validate_certs: true
# Model-specific fields added to every model request, such as Qwen3's switch for its thinking mode.
enrichment_service_request_extra: {}
enrichment_service_ready_retries: 30
enrichment_service_ready_delay: 10
# The image the in-cluster checks run in: the same base as the service, so it is already on the node.
enrichment_service_check_image: registry.access.redhat.com/ubi9/python-312:9.8-1791998425
enrichment_service_checks: true
# This checkout's copy of the service, to compare its versions with the running service's.
enrichment_service_source: "{{ role_path }}/../../services/enrichment"

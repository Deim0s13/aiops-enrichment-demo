---
# Builds an image in the cluster with OpenShift Builds from a directory of this repository (DD08),
# only when that directory has changed since the last successful build, so a change elsewhere in the
# repository does not rebuild it and a rerun changes nothing. Sets incluster_build_image (pinned by
# digest), incluster_build_commit and incluster_build_built.

- name: Store the build's source credentials (the read-only GitHub token, DD16)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/basic-auth
      metadata:
        name: "{{ incluster_build_git_secret }}"
        namespace: "{{ incluster_build_namespace }}"
        labels:
          app.kubernetes.io/part-of: aiops-enrichment-demo
          app.kubernetes.io/component: build-source
      data:
        username: "{{ incluster_build_repository.owner | b64encode }}"
        password: "{{ secrets_values.github_token | b64encode }}"
  no_log: true

- name: Prepare the build
  ansible.builtin.set_fact:
    incluster_build_api: "{{ secrets_values.cluster_api_url | regex_replace('/$', '') }}"
    incluster_build_build_name: ""

- name: Declare the image stream and the build
  kubernetes.core.k8s:
    state: present
    definition:
      - apiVersion: image.openshift.io/v1
        kind: ImageStream
        metadata:
          name: "{{ incluster_build_name }}"
          namespace: "{{ incluster_build_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
      - apiVersion: build.openshift.io/v1
        kind: BuildConfig
        metadata:
          name: "{{ incluster_build_name }}"
          namespace: "{{ incluster_build_namespace }}"
          labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }
        spec:
          source:
            type: Git
            git:
              uri: "{{ incluster_build_repository.url }}"
              ref: "{{ incluster_build_repository.branch }}"
            contextDir: "{{ incluster_build_context_dir }}"
            sourceSecret:
              name: "{{ incluster_build_git_secret }}"
          strategy:
            type: Docker
            dockerStrategy:
              dockerfilePath: "{{ incluster_build_dockerfile }}"
          output:
            to:
              kind: ImageStreamTag
              name: "{{ incluster_build_name }}:latest"
          # Builds are started by this phase, for a known commit, not by changes to the build itself.
          triggers: []

- name: Find the latest commit that changed the service
  ansible.builtin.uri:
    url: >-
      https://api.github.com/repos/{{ incluster_build_repository.owner }}/{{ incluster_build_repository.name
      }}/commits?path={{ incluster_build_context_dir }}&sha={{ incluster_build_repository.branch }}&per_page=1
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ secrets_values.github_token }}"
    timeout: 20
  register: incluster_build_commits
  until: incluster_build_commits is not failed
  retries: 3
  delay: 5
  no_log: true

- name: Find the earlier builds
  kubernetes.core.k8s_info:
    api_version: build.openshift.io/v1
    kind: Build
    namespace: "{{ incluster_build_namespace }}"
    label_selectors: ["buildconfig={{ incluster_build_name }}"]
  register: incluster_build_builds
  until: incluster_build_builds is not failed
  retries: 3
  delay: 5
  no_log: true

- name: Keep only the commit and any successful build of it
  ansible.builtin.set_fact:
    incluster_build_commit: "{{ incluster_build_commits.json[0].sha }}"
    incluster_build_done: >-
      {{ incluster_build_builds.resources | selectattr('status.phase', 'equalto', 'Complete')
         | selectattr('spec.revision.git.commit', 'defined')
         | selectattr('spec.revision.git.commit', 'equalto', incluster_build_commits.json[0].sha)
         | map(attribute='status') | list }}
  no_log: true

- name: Build the image for that commit
  when: incluster_build_done | length == 0
  block:
    - name: Start the build
      ansible.builtin.uri:
        url: >-
          {{ incluster_build_api }}/apis/build.openshift.io/v1/namespaces/{{ incluster_build_namespace
          }}/buildconfigs/{{ incluster_build_name }}/instantiate
        method: POST
        headers:
          Authorization: "Bearer {{ secrets_values.cluster_api_token }}"
        body_format: json
        body:
          kind: BuildRequest
          apiVersion: build.openshift.io/v1
          metadata:
            name: "{{ incluster_build_name }}"
          revision:
            type: Git
            git:
              commit: "{{ incluster_build_commit }}"
        status_code: [200, 201]
        validate_certs: "{{ demo_cluster_validate_certs }}"
        ca_path: "{{ secrets_cluster_ca_file | default(omit) }}"
        timeout: 30
      register: incluster_build_started
      changed_when: true
      no_log: true

    - name: Keep only the build's name
      ansible.builtin.set_fact:
        incluster_build_build_name: "{{ incluster_build_started.json.metadata.name }}"

    # The first build pulls the base image and installs the Python packages: a few minutes.
    - name: Wait for the build to finish
      kubernetes.core.k8s_info:
        api_version: build.openshift.io/v1
        kind: Build
        namespace: "{{ incluster_build_namespace }}"
        name: "{{ incluster_build_build_name }}"
      register: incluster_build_build
      until: >-
        incluster_build_build is not failed
        and (incluster_build_build.resources | map(attribute='status.phase') | first | default('')) in ['Complete', 'Failed', 'Error', 'Cancelled']
      retries: "{{ incluster_build_build_retries }}"
      delay: "{{ incluster_build_build_delay }}"
      no_log: true

    - name: Keep only the build's outcome
      ansible.builtin.set_fact:
        incluster_build_done: "{{ incluster_build_build.resources | map(attribute='status') | list }}"
      no_log: true

    - name: Stop if the build failed
      ansible.builtin.assert:
        that: incluster_build_done[0].phase == 'Complete'
        fail_msg: >-
          The build {{ incluster_build_build_name }} ended {{ incluster_build_done[0].phase }}
          ({{ incluster_build_done[0].message | default('no message') }}).
          See its log with: oc logs build/{{ incluster_build_build_name }} -n {{ incluster_build_namespace }}
        quiet: true

- name: Pin the image by the build's digest
  ansible.builtin.set_fact:
    incluster_build_image: >-
      image-registry.openshift-image-registry.svc:5000/{{ incluster_build_namespace }}/{{ incluster_build_name
      }}@{{ incluster_build_done[0].output.to.imageDigest }}
    incluster_build_built: "{{ incluster_build_build_name | length > 0 }}"

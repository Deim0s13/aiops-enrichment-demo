---
- name: Check that the local secrets file is mounted into the execution environment
  ansible.builtin.stat:
    path: "{{ demo_local_secrets_file }}"
  register: secrets_local_stat

- name: Fail with instructions if the local secrets file is missing
  ansible.builtin.assert:
    that: secrets_local_stat.stat.exists
    fail_msg: >-
      {{ demo_local_secrets_file }} was not found. Mount your secrets directory into the
      execution environment as described in docs/laptop-setup.md.
    quiet: true

- name: Read the local secrets file (decrypted with your ansible-vault password)
  ansible.builtin.include_vars:
    file: "{{ demo_local_secrets_file }}"
    name: secrets_local_raw
  register: secrets_local_read
  failed_when: false
  no_log: true

- name: Fail with instructions if the local secrets file could not be read
  ansible.builtin.assert:
    that: secrets_local_read.ansible_included_var_files | default([]) | length > 0
    fail_msg: >-
      Could not read {{ demo_local_secrets_file }}. If it is encrypted, supply your password with
      --vault-password-file (mounted into the execution environment) or --ask-vault-pass,
      and check that the file is valid YAML with the keys shown in secrets.example.yml.
    quiet: true

- name: Collect the groups that were read
  ansible.builtin.set_fact:
    secrets_by_group: >-
      {{ secrets_local_raw | dict2items | selectattr('key', 'in', secrets_groups)
         | selectattr('value', 'mapping') | items2dict }}
  no_log: true

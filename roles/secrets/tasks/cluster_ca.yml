---
# The file is a scratch copy inside the execution environment container, which is discarded after
# the run, so these tasks do not count as changes: a phase's recap reports changes to the environment.

- name: Create a temporary file for the cluster CA bundle
  ansible.builtin.tempfile:
    suffix: .crt
  register: secrets_cluster_ca_tempfile
  changed_when: false

- name: Write the cluster CA bundle
  ansible.builtin.copy:
    content: "{{ secrets_values.cluster_api_ca_cert }}"
    dest: "{{ secrets_cluster_ca_tempfile.path }}"
    mode: "0644"
  changed_when: false

- name: Record where the cluster CA bundle is
  ansible.builtin.set_fact:
    secrets_cluster_ca_file: "{{ secrets_cluster_ca_tempfile.path }}"

---
# Runs once per requested group, with secrets_group set by the caller's loop. Each group has its own
# AppRole, which can read only that group: log in, read, then revoke the token before the next group.

- name: Log in to Vault with the AppRole for {{ secrets_group }}
  community.hashi_vault.vault_login:
    url: "{{ demo_vault_addr }}"
    auth_method: approle
    role_id: "{{ secrets_approles[secrets_group].role_id }}"
    secret_id: "{{ secrets_approles[secrets_group].secret_id }}"
  register: secrets_vault_login
  changed_when: false
  failed_when: false
  no_log: true

- name: Check that the login succeeded for {{ secrets_group }}
  ansible.builtin.assert:
    that: secrets_vault_login.login.auth.client_token is defined
    fail_msg: >-
      Vault refused the {{ secrets_group }} AppRole login. The usual cause is an expired or rotated
      secret ID, or an approle.env from a different Vault. Issue new secret IDs with
      ansible-playbook playbooks/00_secrets.yml -e vault_bootstrap_rotate_secret_id=true (needs VAULT_TOKEN),
      then source ~/.config/aiops-demo/approle.env again.
    quiet: true

- name: Read the secrets in {{ secrets_group }}
  community.hashi_vault.vault_kv2_get:
    url: "{{ demo_vault_addr }}"
    auth_method: token
    token: "{{ secrets_vault_login.login.auth.client_token }}"
    token_validate: false
    engine_mount_point: "{{ demo_vault_mount }}"
    path: "{{ secrets_group }}"
  register: secrets_vault_read
  failed_when: false
  no_log: true

- name: Keep the secrets if found in {{ secrets_group }}
  ansible.builtin.set_fact:
    secrets_by_group: "{{ secrets_by_group | combine({secrets_group: secrets_vault_read.secret}) }}"
  when: secrets_vault_read.secret is defined
  no_log: true

- name: Revoke the token now that it has read {{ secrets_group }}
  ansible.builtin.uri:
    url: "{{ demo_vault_addr }}/v1/auth/token/revoke-self"
    method: POST
    headers:
      X-Vault-Token: "{{ secrets_vault_login.login.auth.client_token }}"
    status_code: [200, 204]
  when: secrets_revoke_token | bool
  changed_when: false
  no_log: true

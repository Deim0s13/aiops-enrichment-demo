---
- name: Check that AppRole credentials are in the environment
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', 'AIOPS_VAULT_APPROLES', default='') is match('^\\{.*\\}$')
    fail_msg: >-
      AIOPS_VAULT_APPROLES is not set. Run: source ~/.config/aiops-demo/approle.env
    quiet: true

- name: Read the AppRole credentials for each secret group
  ansible.builtin.set_fact:
    secrets_approles: "{{ lookup('ansible.builtin.env', 'AIOPS_VAULT_APPROLES') | from_json }}"
  no_log: true

- name: Check that credentials exist for every requested group
  ansible.builtin.assert:
    that: secrets_groups | reject('in', secrets_approles.keys() | list) | list | length == 0
    fail_msg: >-
      approle.env has no credentials for: {{ secrets_groups | reject('in', secrets_approles.keys() | list) | join(', ') }}.
      Issue new ones with ansible-playbook playbooks/00_secrets.yml -e vault_bootstrap_rotate_secret_id=true
      (needs VAULT_TOKEN), then source ~/.config/aiops-demo/approle.env again.
    quiet: true

- name: Check that Vault is reachable and unsealed
  ansible.builtin.uri:
    url: "{{ demo_vault_addr }}/v1/sys/health"
    status_code: [200, 429, 501, 503]
  register: secrets_vault_health
  failed_when: false

- name: Fail with instructions if Vault is not ready
  ansible.builtin.assert:
    that: secrets_vault_health.status | default(-1) in [200, 429]
    fail_msg: >-
      {{ 'Vault is sealed. Run: ansible-playbook playbooks/00_secrets.yml with AIOPS_VAULT_UNSEAL_KEY set.'
         if secrets_vault_health.status | default(-1) == 503 else
         'Vault is not initialised. Run: ansible-playbook playbooks/00_secrets.yml'
         if secrets_vault_health.status | default(-1) == 501 else
         'Cannot reach Vault at ' ~ demo_vault_addr ~ '. Check that the aiops-demo-vault container is running,
          and see the troubleshooting section of docs/laptop-setup.md.' }}
    quiet: true

- name: Start with no secret groups read
  ansible.builtin.set_fact:
    secrets_by_group: {}

- name: Read each group with its own AppRole
  ansible.builtin.include_tasks: vault_group.yml
  loop: "{{ secrets_groups }}"
  loop_control:
    loop_var: secrets_group

---
# Resolves the secrets named in demo_required_secrets into the secrets_values fact.
# This role is the only place in the build that reads secrets.

# At -vvv, Ansible prints each module's arguments, and kubernetes.core 6.6.0 prints api_key in
# clear text there, even on success. Rather than hide every cluster task (no_log also hides the
# error), refuse to resolve real secrets at that verbosity. Debug at -vv, or override only with
# throwaway credentials.
- name: Refuse to resolve secrets at -vvv or higher
  ansible.builtin.assert:
    that: ansible_verbosity | int < 3 or secrets_allow_debug_verbosity | bool
    fail_msg: >-
      This run uses verbosity {{ ansible_verbosity }}. At -vvv and above, some modules print
      credentials in clear text, so secrets are not resolved. Rerun with -vv or less. Set
      secrets_allow_debug_verbosity=true only when every credential in use is a throwaway test value.
    quiet: true

- name: Check the secrets backend setting
  ansible.builtin.assert:
    that: demo_secrets_backend in ['vault', 'local']
    fail_msg: "demo_secrets_backend must be 'vault' or 'local', not '{{ demo_secrets_backend }}'."
    quiet: true

- name: Select the secrets in the requested groups
  ansible.builtin.set_fact:
    secrets_selected: >-
      {{ demo_required_secrets | dict2items
         | selectattr('value.path', 'in', secrets_groups) | items2dict }}

- name: Read the secret groups from the configured backend
  ansible.builtin.include_tasks: "{{ demo_secrets_backend }}.yml"

- name: Map each required secret to its value
  ansible.builtin.set_fact:
    secrets_values: >-
      {{ secrets_values | default({})
         | combine({item.key: (secrets_by_group[item.value.path] | default({}))[item.value.key] | default('')}) }}
  loop: "{{ secrets_selected | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: List secret groups that could not be read
  ansible.builtin.set_fact:
    secrets_missing_groups: "{{ secrets_groups | reject('in', secrets_by_group.keys() | list) | list }}"

# Modules take the cluster CA as a file path, not a value. The bundle is not a secret, and the
# file lives only in the execution environment container, which is discarded after the run.
- name: Write the cluster CA bundle to a file
  ansible.builtin.include_tasks: cluster_ca.yml
  when: secrets_values.cluster_api_ca_cert | default('') | length > 0

- name: Check the cluster connection and token
  ansible.builtin.include_tasks: cluster_check.yml
  when:
    - secrets_check_cluster | bool
    - "'cluster' in secrets_groups"
    - secrets_values.cluster_api_url | default('') | length > 0

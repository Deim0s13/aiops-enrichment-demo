---
# Resolves the secrets named in demo_required_secrets into the secrets_values fact.
# This role is the only place in the build that reads secrets.

- name: Check the secrets backend setting
  ansible.builtin.assert:
    that: demo_secrets_backend in ['vault', 'local']
    fail_msg: "demo_secrets_backend must be 'vault' or 'local', not '{{ demo_secrets_backend }}'."
    quiet: true

- name: Select the secrets in the requested groups
  ansible.builtin.set_fact:
    secrets_selected: >-
      {{ demo_required_secrets | dict2items
         | selectattr('value.path', 'in', secrets_groups) | items2dict }}

- name: Read the secret groups from the configured backend
  ansible.builtin.include_tasks: "{{ demo_secrets_backend }}.yml"

- name: Map each required secret to its value
  ansible.builtin.set_fact:
    secrets_values: >-
      {{ secrets_values | default({})
         | combine({item.key: (secrets_by_group[item.value.path] | default({}))[item.value.key] | default('')}) }}
  loop: "{{ secrets_selected | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: List secret groups that could not be read
  ansible.builtin.set_fact:
    secrets_missing_groups: "{{ secrets_groups | reject('in', secrets_by_group.keys() | list) | list }}"

---
# A quick check that the cluster can be reached and accepts the token, before a phase changes
# anything. Session tokens expire after 24 hours by default, so an expired token is the most common
# reason a cluster phase fails; this turns it into a clear message instead of a traceback from the
# first task that calls the cluster. Only status codes are shown, never the token.

- name: Check that the cluster API is reachable (unauthenticated, so errors can be shown)
  ansible.builtin.uri:
    url: "{{ secrets_values.cluster_api_url | regex_replace('/$', '') }}/version"
    validate_certs: "{{ demo_cluster_validate_certs }}"
    ca_path: "{{ secrets_cluster_ca_file | default(omit) }}"
    status_code: [200, 401, 403]
    timeout: 15
  register: secrets_cluster_ping
  until: secrets_cluster_ping.status | default(-1) in [200, 401, 403]
  retries: 3
  delay: 5
  failed_when: false

- name: Report an unreachable cluster API
  ansible.builtin.assert:
    that: secrets_cluster_ping.status | default(-1) in [200, 401, 403]
    fail_msg: >-
      Cannot reach the cluster API at {{ secrets_values.cluster_api_url }}
      ({{ secrets_cluster_ping.msg | default('no response') | truncate(250) }}).
      Check that the environment is running and that aiops-demo/cluster holds its current API URL.
      {{ ('The API certificate is not signed by the CA bundle in aiops-demo/cluster api_ca_cert.
          Load the CA of the current environment as in step 3 of docs/build-guide.md.'
          if secrets_cluster_ca_file is defined else
          'The API presents a certificate signed by a CA that is not publicly trusted. Load the
          CA of the cluster into aiops-demo/cluster api_ca_cert as in step 3 of docs/build-guide.md.')
         if 'CERTIFICATE_VERIFY_FAILED' in (secrets_cluster_ping.msg | default('')) else '' }}
    quiet: true

- name: Check that the cluster accepts the token
  ansible.builtin.uri:
    url: "{{ secrets_values.cluster_api_url | regex_replace('/$', '') }}/apis/user.openshift.io/v1/users/~"
    headers:
      Authorization: "Bearer {{ secrets_values.cluster_api_token }}"
    validate_certs: "{{ demo_cluster_validate_certs }}"
    ca_path: "{{ secrets_cluster_ca_file | default(omit) }}"
    status_code: [200, 401, 403]
    timeout: 15
  register: secrets_cluster_whoami
  until: secrets_cluster_whoami.status | default(-1) in [200, 401, 403]
  retries: 3
  delay: 5
  failed_when: false
  no_log: true

- name: Report a token the cluster does not accept
  ansible.builtin.assert:
    that: secrets_cluster_whoami.status | default(-1) == 200
    fail_msg: >-
      The cluster API is reachable but {{ 'did not accept the token (HTTP 401): it has probably expired'
      if secrets_cluster_whoami.status | default(-1) == 401 else 'returned HTTP '
      ~ secrets_cluster_whoami.status | default('no response') ~ ' for the token' }}.
      Session tokens last 24 hours. Log in again with oc login and update api_token in
      aiops-demo/cluster, as in step 3 of docs/build-guide.md.
    success_msg: >-
      Cluster API reachable; the token is accepted for
      {{ secrets_cluster_whoami.json.metadata.name | default('an unnamed user') }}.
    quiet: false

---
# Secret groups to resolve. Each group is a Vault path under demo_vault_mount (or a top-level
# key in the local file). Callers pass only the groups they need.
secrets_groups: [entitlements, cluster, servicenow]

# Revoke the Vault token once the secrets have been read.
secrets_revoke_token: true

# Allow secrets to be resolved at -vvv or higher. Only for testing with throwaway credentials,
# because some modules print their arguments, including credentials, at that verbosity.
secrets_allow_debug_verbosity: false

# When the cluster group is read, check that the cluster API is reachable and accepts the token, so
# an expired token stops the phase with a clear message before anything changes. Preflight turns
# this off because it runs a fuller check of its own.
secrets_check_cluster: true

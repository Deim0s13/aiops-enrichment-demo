---
# Runs once per secret group, with vault_bootstrap_group set by the caller's loop.

- name: Read the role ID for {{ vault_bootstrap_group }}
  ansible.builtin.uri:
    url: "{{ vault_bootstrap_api }}/v1/auth/approle/role/{{ vault_bootstrap_name_prefix }}-{{ vault_bootstrap_group }}/role-id"
    headers:
      X-Vault-Token: "{{ vault_bootstrap_token }}"
  register: vault_bootstrap_role_id
  no_log: true

- name: Generate a secret ID for {{ vault_bootstrap_group }}
  ansible.builtin.uri:
    url: "{{ vault_bootstrap_api }}/v1/auth/approle/role/{{ vault_bootstrap_name_prefix }}-{{ vault_bootstrap_group }}/secret-id"
    method: POST
    body_format: json
    body:
      metadata: '{"issued_by": "00_secrets.yml"}'
    headers:
      X-Vault-Token: "{{ vault_bootstrap_token }}"
  register: vault_bootstrap_secret_id
  changed_when: true
  no_log: true

- name: List the secret IDs issued for {{ vault_bootstrap_group }}
  ansible.builtin.uri:
    url: "{{ vault_bootstrap_api }}/v1/auth/approle/role/{{ vault_bootstrap_name_prefix }}-{{ vault_bootstrap_group }}/secret-id?list=true"
    headers:
      X-Vault-Token: "{{ vault_bootstrap_token }}"
    status_code: [200, 404]
  register: vault_bootstrap_secret_id_list
  no_log: true

- name: Revoke every earlier secret ID for {{ vault_bootstrap_group }}
  ansible.builtin.uri:
    url: "{{ vault_bootstrap_api }}/v1/auth/approle/role/{{ vault_bootstrap_name_prefix }}-{{ vault_bootstrap_group }}/secret-id-accessor/destroy"
    method: POST
    body_format: json
    body:
      secret_id_accessor: "{{ item }}"
    headers:
      X-Vault-Token: "{{ vault_bootstrap_token }}"
    status_code: [200, 204]
  # Bracket syntax: in Jinja, .keys would resolve to the dictionary's keys() method
  loop: >-
    {{ (vault_bootstrap_secret_id_list.json.data['keys'] | default([]))
       | reject('equalto', vault_bootstrap_secret_id.json.data.secret_id_accessor) | list }}
  loop_control:
    label: earlier secret ID
  changed_when: true
  no_log: true

- name: Add to the operator credentials the AppRole for {{ vault_bootstrap_group }}
  ansible.builtin.set_fact:
    vault_bootstrap_credentials: >-
      {{ vault_bootstrap_credentials | combine({vault_bootstrap_group: {
           'role_id': vault_bootstrap_role_id.json.data.role_id,
           'secret_id': vault_bootstrap_secret_id.json.data.secret_id}}) }}
  no_log: true

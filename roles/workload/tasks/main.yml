---
- name: Create the namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ workload_namespace }}"
        labels: { app.kubernetes.io/part-of: aiops-enrichment-demo }

- name: Build the image in the cluster, if the service's source has changed
  ansible.builtin.include_role:
    name: incluster_build
  vars:
    incluster_build_name: "{{ workload_name }}"
    incluster_build_namespace: "{{ workload_namespace }}"
    incluster_build_context_dir: "{{ workload_context_dir }}"
    incluster_build_repository: "{{ workload_repository }}"
    incluster_build_git_secret: "{{ workload_git_secret }}"

- name: Read the integration's event stream address and credentials (phase 07)
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ workload_caller_namespace }}"
    name: "{{ workload_alert_stream_secret }}"
  register: workload_alert_stream
  until: workload_alert_stream is not failed
  retries: 3
  delay: 5
  no_log: true

- name: Stop if phase 07 has not set up the integration's event stream
  ansible.builtin.assert:
    that: ((workload_alert_stream.resources | first | default({})).data | default({})).url is defined
    fail_msg: >-
      There is no event stream address in Secret {{ workload_alert_stream_secret }} in {{ workload_caller_namespace }}.
      Run phase 07 first.
    quiet: true

- name: Give Alertmanager the event stream's address and credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ workload_alertmanager_secret }}"
        namespace: "{{ workload_namespace }}"
        labels: { app.kubernetes.io/part-of: aiops-enrichment-demo, app.kubernetes.io/component: alert-routing }
      data:
        url: "{{ workload_alert_stream.resources[0].data.url }}"
        username: "{{ workload_alert_stream.resources[0].data.username }}"
        password: "{{ workload_alert_stream.resources[0].data.password }}"
  no_log: true

- name: Deploy the service, its metrics, its alert rules and routing, and its network policies
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'resources.yml.j2') | from_yaml_all | list }}"

- name: Wait for the service to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ workload_namespace }}"
    name: "{{ workload_name }}"
  register: workload_deployment
  until: >-
    workload_deployment is not failed
    and (workload_deployment.resources | map(attribute='status') | first | default({})).availableReplicas | default(0) >= 1
  retries: "{{ workload_ready_retries }}"
  delay: "{{ workload_ready_delay }}"
  no_log: true

- name: Report the service
  ansible.builtin.set_fact:
    workload_report:
      - >-
        Image: {{ 'built from commit ' ~ incluster_build_commit[:12] if incluster_build_built else
                  'already built for commit ' ~ incluster_build_commit[:12] }}; {{ incluster_build_image }}
      - >-
        Service: {{ workload_name }}.{{ workload_namespace }}.svc:{{ workload_port }}, memory limit {{ workload_memory_limit }},
        maximum heap {{ workload_max_heap }}; callers only from {{ workload_caller_namespace }} and user workload monitoring
      - >-
        Alert rules: PaymentsNotifyHeapHigh (heap above {{ (workload_heap_alert_ratio * 100) | int }}% for
        {{ workload_heap_alert_for }}), PaymentsNotifyOOMKilled (for {{ workload_oom_alert_window }} after each kill)
      - >-
        Alert routing: grouped by service and incident family, to the integration stand-in's event stream with
        Basic authentication (Secret {{ workload_alertmanager_secret }})

- name: Prove the fault
  ansible.builtin.include_tasks: checks.yml
  when: workload_checks | bool

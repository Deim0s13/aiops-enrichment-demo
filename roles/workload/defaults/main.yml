---
# Phase 08: the sample service payments-notify (DD01), its metrics and its alert rules.
workload_name: payments-notify
workload_context_dir: services/payments-notify
workload_git_secret: payments-notify-git-source
workload_port: 8080
# The release the demo runs, as its deployment's app.kubernetes.io/version label. The diagnostics read
# it, and the enrichment service retrieves only documents for its major version (2.x).
workload_version: 2.4.1

# The misconfiguration the fault relies on: the maximum heap equals the container's memory limit, so
# the JVM's own memory pushes the container over the limit before the heap is full, and the kernel
# kills it (OOMKilled). Growth is slow enough for the heap alert to fire before the kill.
workload_memory_limit: 256Mi
workload_max_heap: 256m
workload_leak_mb_per_second: 1

# Alert rules (OpenShift user workload monitoring). Labels let the integration stand-in and the
# enrichment know what the alert is about.
# The heap is above half its maximum for about 90 seconds before the kill. Rules are evaluated every
# 30 seconds, a scrape behind, so the alert fires on the first evaluation above the threshold: a
# hold (for) would let the kill come first, as 60% with a 30-second hold did (2026-10-21).
workload_heap_alert_ratio: 0.5
workload_heap_alert_for: 0s
workload_alert_labels:
  service: payments-notify
  incident_family: jvm-memory
  team: payments
# Provider throttling (scenario S2, DD25): MessageHub refuses deliveries, and confirmations queue. The
# alert is critical, so it raises its own incident, for its own problem: customers are not being told
# about their payments. Its backlog passes the threshold within seconds of the fault starting.
workload_throttling_alert_labels:
  service: payments-notify
  incident_family: provider-throttling
  team: payments
workload_backlog_alert: 200
workload_backlog_alert_for: 1m
# How long MessageHub throttles before it accepts deliveries again and the backlog drains.
workload_throttle_seconds: 900
# The OOMKilled alert stays firing this long after a kill. kube-state-metrics is scraped less often
# than the service, so a shorter window can miss the restart (2 minutes did, 2026-10-21). In the
# recurring scenario the kills come faster than this, so the alert stays firing; the heap alert,
# which clears at each restart, is what counts the cycles.
workload_oom_alert_window: 5m

# Alertmanager routing to the monitoring integration stand-in (DD19). Phase 07 keeps its event
# stream's address and Basic credentials in a Secret in the AAP namespace; phase 08 copies them here.
# Alerts are grouped by problem, so one notification carries every alert for it.
workload_alert_stream_secret: eda-event-stream-alertmanager
workload_alertmanager_secret: alertmanager-integration
workload_alert_group_wait: 10s
workload_alert_group_interval: 30s
workload_alert_repeat_interval: 12h

# The diagnostics' service account (phase 07, DD20), in the caller's namespace. The application team
# grants it view on this namespace and nothing else: pods, events, logs and, through the Thanos
# Querier tenancy endpoint, metrics.
workload_diagnostics_sa: aiops-diagnostics

workload_ready_retries: 30
workload_ready_delay: 10

# Prove the fault on every build: trigger the single scenario, wait for the OOMKill and recovery, and
# confirm the metrics and the alert. Takes about five minutes.
workload_checks: true
workload_check_image: registry.access.redhat.com/ubi9/python-312:9.8-1791998425
workload_check_retries: 48
workload_check_delay: 10
# After the alerts fire: how long to wait for the integration's incident and its enrichment.
workload_incident_retries: 60
workload_incident_delay: 10
# The memory fault's enrichment must cite the current runbook or a past resolution (design 9), and never
# the superseded 1.x runbook, the restricted break-glass procedure or another service's resolution.
workload_expected_sources: [KB-RB-014, KB-RS-044, KB-RS-031]
workload_forbidden_sources: [KB-RB-009, KB-SEC-003, KB-RS-029]
# Prove the throttling scenario (S2) too, after the memory fault: a fresh pod, the fault, its alert, its
# own incident, and a note that says there is no documented fix and gives only low-trust suggestions.
# Adds about five minutes.
workload_check_throttling: true

---
# ServiceNow foundation for phase 04 (design sections 5.1, 5.4 and 6.1). The assignment group and
# the namespace for the identities' Secrets are inputs (meta/argument_specs.yml). The PDI's URL and
# administrator credential are read from secrets_values (group servicenow).

# Values ServiceNow returns as strings are written as strings here ("true", "10"), so the role can
# compare what it wants with what is there and change only what differs.

# Custom incident fields (design section 5.4). Group ai_enrichment marks the fields only the
# enrichment writer may set; group integration holds the monitoring integration stand-in's own
# record of the alerts it has added to an incident (DD19).
servicenow_fields:
  - element: u_ai_enrichment_state
    group: ai_enrichment
    column_label: AI enrichment state
    internal_type: string
    max_length: "40"
    choice: "1"
    choices:
      - { value: pending, label: Pending }
      - { value: complete, label: Complete }
      - { value: insufficient_evidence, label: Insufficient evidence }
      - { value: unavailable, label: Unavailable }
  - element: u_ai_enrichment_rev
    group: ai_enrichment
    column_label: AI enrichment revision
    internal_type: integer
    choices: []
  - element: u_ai_enrichment_rating
    group: ai_enrichment
    column_label: AI enrichment rating
    internal_type: string
    max_length: "40"
    choice: "1"
    choices:
      - { value: useful, label: Useful }
      - { value: incorrect, label: Incorrect }
      - { value: unsafe, label: Unsafe }
  - element: u_acme_alert_occurrences
    group: integration
    column_label: Alert occurrences
    internal_type: integer
    choices: []
  - element: u_acme_alert_state
    group: integration
    column_label: Alert state
    internal_type: string
    max_length: "4000"
    choices: []

# Configuration items (CIs) the service map names, keyed by name with a description. The playbook
# passes demo_service_map; each CI is an application supported by the on-call group.
servicenow_configuration_items: {}
servicenow_ci_class: cmdb_ci_appl

# One custom role per identity. It marks what the identity is for: the guards below apply to
# whoever holds it. The PDI refuses access rule (ACL) changes over the API, so the roles carry no
# rights themselves (design section 6.1).
servicenow_roles:
  - name: acme_monitoring_integration
    description: ACME Bank monitoring integration stand-in. Creates incidents; cannot write AI enrichment fields.
  - name: acme_ai_enrichment
    description: ACME Bank AI enrichment writer. Writes work notes and AI enrichment fields only.

# Web service only accounts: they cannot sign in to the ServiceNow interface.
servicenow_identities:
  - user_name: svc-monitoring
    first_name: Monitoring
    last_name: Integration
    role: acme_monitoring_integration
  - user_name: svc-ai-enrichment
    first_name: AI
    last_name: Enrichment
    role: acme_ai_enrichment

# Built-in roles every identity also holds. itil gives access to the incident table; the guards
# narrow it.
servicenow_identity_builtin_roles: [itil]

# Guard business rules: they run inside ServiceNow before every incident insert and update, for any
# channel including the API, and reject what an identity's row in design section 6.1 does not allow.
servicenow_guards:
  - name: "ACME guard: AI enrichment writer"
    template: guard_enrichment_writer.js.j2
    role: acme_ai_enrichment
    description: >-
      The AI enrichment writer cannot create incidents, and may change only work notes and the AI
      enrichment state and revision. Managed by the aiops-enrichment-demo build (phase 04).
  - name: "ACME guard: monitoring integration"
    template: guard_monitoring_integration.js.j2
    role: acme_monitoring_integration
    description: >-
      The monitoring integration stand-in can create incidents but cannot set or change the AI
      enrichment fields. Managed by the aiops-enrichment-demo build (phase 04).
servicenow_guard_order: "10"
# What the enrichment writer may change.
servicenow_enrichment_writer_fields: [work_notes, u_ai_enrichment_state, u_ai_enrichment_rev]

# A fictional engineer in the on-call group, so the group's notifications have a recipient. A normal
# user without a password: the notification lands in the PDI's Outbox and nobody signs in as them.
servicenow_engineer:
  user_name: acme.oncall
  first_name: ACME
  last_name: On-call engineer
  email: oncall@acme-bank.example

# The "AI enrichment ready" notification (design section 5.4), to the incident's assignment group.
servicenow_notification:
  name: AI enrichment ready
  states: [complete, insufficient_evidence]
  subject: "AI enrichment ready for ${number}: ${short_description}"
  message: >-
    <p>AI-generated enrichment for ${number} is ready (${u_ai_enrichment_state}).</p>
    <p>It has not been reviewed by an engineer. Read the work note and check its evidence before acting.</p>
    <p>${URI_REF}</p>

# Prove the identities' limits on every build by acting as each identity (checks.yml). Test incidents
# are priority 5 and unassigned, so the enrichment trigger never picks them up, and are removed after.
servicenow_checks: true
servicenow_check_prefix: ACME build check

# Each identity's credentials go to a Secret named <prefix><user_name> in servicenow_secret_namespace.
servicenow_identity_secret_prefix: servicenow-
servicenow_password_length: 32

servicenow_timeout: 30

# The trigger (phase 07, entry point trigger). The rule's condition is design 5.1: the on-call group,
# the category and these priorities, with an empty enrichment state.
servicenow_trigger_secret: eda-event-stream-servicenow
servicenow_trigger_rest_message: ACME AI enrichment event stream
servicenow_trigger_rule: "ACME trigger: AI enrichment"
servicenow_trigger_priorities: ["2", "3"]
servicenow_trigger_check_retries: 30
servicenow_trigger_check_delay: 10

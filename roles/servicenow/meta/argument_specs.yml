---
argument_specs:
  main:
    short_description: Prepare the ServiceNow PDI for the demo
    description:
      - Custom incident fields and choices, the on-call assignment group with a fictional engineer, a custom role per
        service identity, the service identities with generated passwords kept in the cluster, guard business rules
        that limit them, the enrichment ready notification, and checks that act as each identity.
      - Reads the PDI URL and administrator credential from secrets_values (group servicenow).
    options:
      servicenow_assignment_group:
        type: str
        required: true
        description: Name of the on-call assignment group the trigger matches.
      servicenow_secret_namespace:
        type: str
        required: true
        description: Namespace for the Secrets that hold the service identities' credentials.
      servicenow_fields:
        type: list
        elements: dict
        description:
          - Custom incident fields, each with its choices and a group, ai_enrichment or integration.
          - The monitoring guard protects the ai_enrichment group.
      servicenow_roles:
        type: list
        elements: dict
        description: Custom roles, each with a name and description.
      servicenow_identities:
        type: list
        elements: dict
        description: Service identities, each with user_name, first_name, last_name and role.
      servicenow_identity_secret_prefix:
        type: str
        description: Prefix for the name of each identity's Secret.
      servicenow_password_length:
        type: int
        description: Length of the generated passwords.
      servicenow_identity_builtin_roles:
        type: list
        elements: str
        description: Built-in roles every identity also holds, such as itil for incident access.
      servicenow_guards:
        type: list
        elements: dict
        description: Guard business rules, each with name, template, role and description.
      servicenow_guard_order:
        type: str
        description: Order of the guard business rules; low, so they run before others.
      servicenow_enrichment_writer_fields:
        type: list
        elements: str
        description: The incident fields the enrichment writer may change.
      servicenow_engineer:
        type: dict
        description: The fictional on-call engineer who receives the group's notifications.
      servicenow_notification:
        type: dict
        description: The enrichment ready notification, with name, states, subject and message.
      servicenow_checks:
        type: bool
        description: Prove the identities' limits by acting as each identity.
      servicenow_check_prefix:
        type: str
        description: Start of the short description of every test incident, used to remove them.
      servicenow_timeout:
        type: int
        description: Seconds to wait for each ServiceNow API call.
  trigger:
    short_description: Post qualifying incidents to the AAP event stream, and prove it hands-off
    description:
      - Phase 07. Keeps an Outbound REST Message with the event stream's address and token, read from the Secret
        phase 07 stores them in, and an asynchronous business rule that posts each new qualifying incident (design 5.1).
      - Proves it by raising incidents as svc-monitoring and reading the outcome back, then removes them.
    options:
      servicenow_assignment_group:
        type: str
        required: true
        description: Name of the on-call assignment group the trigger matches.
      servicenow_trigger_category:
        type: str
        required: true
        description: Incident category the trigger matches.
      servicenow_secret_namespace:
        type: str
        required: true
        description: Namespace holding the event stream Secret and the identities' Secrets.
      servicenow_trigger_secret:
        type: str
        description: Secret holding the event stream's url, header and token.
      servicenow_trigger_rest_message:
        type: str
        description: Name of the Outbound REST Message.
      servicenow_trigger_rule:
        type: str
        description: Name of the trigger business rule.
      servicenow_trigger_priorities:
        type: list
        elements: str
        description: Incident priorities the trigger matches.
      servicenow_identity_secret_prefix:
        type: str
        description: Prefix of the identities' Secrets; the checks raise incidents as svc-monitoring.
      servicenow_checks:
        type: bool
        description: Prove the trigger hands-off.
      servicenow_check_prefix:
        type: str
        description: Start of the short description of every test incident.
      servicenow_trigger_check_retries:
        type: int
        description: How many times to check for the enrichment.
      servicenow_trigger_check_delay:
        type: int
        description: Seconds between those checks.
      servicenow_timeout:
        type: int
        description: Seconds to wait for each ServiceNow API call.

---
# Serves one model on vLLM as an LLMInferenceService and registers it with Models-as-a-Service
# (DD04, DD14). The model and its namespace are inputs (meta/argument_specs.yml).

# The MaaS gateway the model is published on. Its name and namespace are fixed by MaaS.
model_serving_gateway_name: maas-default-gateway
model_serving_gateway_namespace: openshift-ingress

# Sized for an 8B FP8 model on one L4.
model_serving_cpu: "4"
model_serving_memory: 16Gi
model_serving_memory_limit: 24Gi
model_serving_gpus: 1

# The first start pulls the vLLM image and the ModelCar (several GB each) and loads the model onto
# the GPU, so the wait is long.
model_serving_ready_retries: 90
model_serving_ready_delay: 20

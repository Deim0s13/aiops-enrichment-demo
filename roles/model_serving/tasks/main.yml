---
# The model owner's part (DD04, DD14): serve one model on vLLM and register it with Models-as-a-
# Service, or remove it again (model_serving_state: absent), for example to free the GPU for another
# model. Cluster access comes from the module_defaults the calling play sets.

- name: Start the model serving report
  ansible.builtin.set_fact:
    model_serving_report: []

- name: Serve the model
  ansible.builtin.include_tasks: present.yml
  when: model_serving_state == 'present'

- name: Remove the model
  ansible.builtin.include_tasks: absent.yml
  when: model_serving_state == 'absent'

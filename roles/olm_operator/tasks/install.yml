---
# The standard OLM sequence: namespace, OperatorGroup, Subscription. OLM then creates an
# InstallPlan and a ClusterServiceVersion (CSV); main.yml waits for the CSV.

- name: Read the catalogue entry for {{ olm_operator_package }}
  kubernetes.core.k8s_info:
    api_version: packages.operators.coreos.com/v1
    kind: PackageManifest
    namespace: "{{ olm_operator_source_namespace }}"
    name: "{{ olm_operator_package }}"
  register: olm_operator_packagemanifest

- name: Check that the catalogue offers the requested channel for {{ olm_operator_package }}
  ansible.builtin.assert:
    that:
      - olm_operator_packagemanifest.resources | length == 1
      - olm_operator_channel in olm_operator_packagemanifest.resources[0].status.channels | map(attribute='name')
      - olm_operator_packagemanifest.resources[0].status.catalogSource == olm_operator_source
    fail_msg: >-
      {{ ('The catalogue has no package named ' ~ olm_operator_package ~ '.')
         if not olm_operator_packagemanifest.resources else
         (olm_operator_package ~ ' comes from ' ~ olm_operator_packagemanifest.resources[0].status.catalogSource
          ~ ' with channels ' ~ (olm_operator_packagemanifest.resources[0].status.channels | map(attribute='name') | join(', '))
          ~ ' (default ' ~ olm_operator_packagemanifest.resources[0].status.defaultChannel ~ '), but this kit asks for channel '
          ~ olm_operator_channel ~ ' from ' ~ olm_operator_source ~ '. Update the channel in inventory/group_vars.') }}
    quiet: true

- name: Create the operator namespace {{ olm_operator_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ olm_operator_namespace }}"
  when: olm_operator_namespace != 'openshift-operators'

- name: Look for an OperatorGroup in {{ olm_operator_namespace }}
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1
    kind: OperatorGroup
    namespace: "{{ olm_operator_namespace }}"
  register: olm_operator_groups

- name: Create an OperatorGroup for {{ olm_operator_namespace }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: "{{ olm_operator_namespace }}"
        namespace: "{{ olm_operator_namespace }}"
      spec:
        targetNamespaces:
          - "{{ olm_operator_namespace }}"
  when: olm_operator_groups.resources | length == 0

- name: Subscribe to the operator {{ olm_operator_package }}
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: "{{ olm_operator_package }}"
        namespace: "{{ olm_operator_namespace }}"
      spec:
        name: "{{ olm_operator_package }}"
        channel: "{{ olm_operator_channel }}"
        source: "{{ olm_operator_source }}"
        sourceNamespace: "{{ olm_operator_source_namespace }}"
        installPlanApproval: Automatic

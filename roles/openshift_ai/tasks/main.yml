---
# The platform team's part of phase 02 (DD13, DD14, DD07): checks OpenShift AI, installs Red Hat
# Connectivity Link and Kuadrant, creates the MaaS gateway, switches on Models-as-a-Service and
# MLflow, and runs the MLflow server. Models and their consumers are onboarded by the model_serving
# and maas_consumer roles. Cluster access comes from the module_defaults the calling play sets.

- name: Start the platform report
  ansible.builtin.set_fact:
    openshift_ai_report: []

- name: Check that the environment provides a recent enough OpenShift AI
  ansible.builtin.include_role:
    name: olm_operator
  vars:
    olm_operator_package: "{{ openshift_ai_operator.package }}"
    olm_operator_channel: "{{ openshift_ai_operator.channel }}"
    olm_operator_min_version: "{{ openshift_ai_operator.min_version }}"
    olm_operator_adopt_only: true

- name: Install Red Hat Connectivity Link
  ansible.builtin.include_tasks: connectivity_link.yml

- name: Record the operators
  ansible.builtin.set_fact:
    openshift_ai_report: >-
      {{ openshift_ai_report + [item.package ~ ' ' ~ item.version ~ ': ' ~ item.action
                                ~ ' (channel ' ~ item.channel ~ ', namespace ' ~ item.namespace ~ ')'] }}
  loop: "{{ olm_operator_results | default([]) }}"
  loop_control:
    label: "{{ item.package }}"

- name: Record the Kuadrant result
  ansible.builtin.set_fact:
    openshift_ai_report: "{{ openshift_ai_report + ['Kuadrant: ready in ' ~ openshift_ai_kuadrant_namespace] }}"

- name: Set up the MaaS gateway and switch on MaaS and MLflow
  ansible.builtin.include_tasks: maas.yml

- name: Run the MLflow server
  ansible.builtin.include_tasks: mlflow.yml

---
# Part 3 of phase 02, second half: governed access for the enrichment service (DD14, ADR06).
# The enrichment service has its own identity (a service account), which a MaaSAuthPolicy allows to
# call the model and a MaaSSubscription gives a token budget. Its MaaS API key is minted with that
# identity and kept in a Secret in the enrichment namespace, so usage is attributed to it and the
# key can be revoked on its own.

- name: Work out the consumer identity and the MaaS address
  ansible.builtin.set_fact:
    openshift_ai_consumer_user: >-
      system:serviceaccount:{{ demo_namespaces.enrichment }}:{{ demo_maas_consumer.service_account }}
    openshift_ai_maas_url: "https://{{ openshift_ai_maas_hostname }}"

- name: Create the enrichment namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ demo_namespaces.enrichment }}"

- name: Create the enrichment service's identity
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ demo_maas_consumer.service_account }}"
        namespace: "{{ demo_namespaces.enrichment }}"

# Both are needed: the policy decides who may call the model, the subscription how much.
- name: Allow the enrichment service to call the model
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: MaaSAuthPolicy
      metadata:
        name: "{{ demo_maas_consumer.service_account }}"
        namespace: "{{ openshift_ai_maas_tenant_namespace }}"
        annotations:
          openshift.io/description: Model access for the AIOps enrichment service
      spec:
        modelRefs:
          - name: "{{ demo_model.name }}"
            namespace: "{{ demo_namespaces.models }}"
        subjects:
          users:
            - "{{ openshift_ai_consumer_user }}"

- name: Give the enrichment service a token budget
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: maas.opendatahub.io/v1alpha1
      kind: MaaSSubscription
      metadata:
        name: "{{ demo_maas_consumer.service_account }}"
        namespace: "{{ openshift_ai_maas_tenant_namespace }}"
        annotations:
          openshift.io/description: Token budget for the AIOps enrichment service
      spec:
        owner:
          users:
            - "{{ openshift_ai_consumer_user }}"
        modelRefs:
          - name: "{{ demo_model.name }}"
            namespace: "{{ demo_namespaces.models }}"
            tokenRateLimits:
              - limit: "{{ demo_maas_consumer.token_limit | int }}"
                window: "{{ demo_maas_consumer.token_window }}"

- name: Wait for the policy and the subscription to be active
  kubernetes.core.k8s_info:
    api_version: maas.opendatahub.io/v1alpha1
    kind: "{{ item }}"
    namespace: "{{ openshift_ai_maas_tenant_namespace }}"
    name: "{{ demo_maas_consumer.service_account }}"
  register: openshift_ai_maas_access
  until: (openshift_ai_maas_access.resources | first | default({})).status.phase | default('') == 'Active'
  retries: "{{ openshift_ai_maas_resource_retries }}"
  delay: "{{ openshift_ai_maas_resource_delay }}"
  failed_when: false
  loop: [MaaSAuthPolicy, MaaSSubscription]

# Reduced to kind, phase and messages first: looping over the registered results would print each
# module invocation, cluster token included, at -vv.
- name: Summarise the policy and subscription status
  ansible.builtin.set_fact:
    openshift_ai_maas_access_status: >-
      {{ openshift_ai_maas_access_status | default([]) + [{
           'kind': item.item,
           'phase': (item.resources | first | default({})).status.phase | default(''),
           'messages': (item.resources | first | default({})).status.conditions | default([])
                       | map(attribute='message', default='') | select | join('; ')}] }}
  loop: "{{ openshift_ai_maas_access.results }}"
  loop_control:
    label: "{{ item.item }}"
  no_log: true

- name: Report a policy or subscription that is not active
  ansible.builtin.assert:
    that: item.phase == 'Active'
    fail_msg: >-
      The {{ item.kind }} for the enrichment service is {{ item.phase or 'not reporting a phase' }}:
      {{ item.messages or 'no status yet' }}.
      Check it with: oc get {{ item.kind | lower }} {{ demo_maas_consumer.service_account }}
      -n {{ openshift_ai_maas_tenant_namespace }} -o yaml
    quiet: true
  loop: "{{ openshift_ai_maas_access_status }}"
  loop_control:
    label: "{{ item.kind }}"

# Now that the policy and subscription are active, MaaS can pair them with the model.
- name: Wait for MaaS to accept the model
  kubernetes.core.k8s_info:
    api_version: maas.opendatahub.io/v1alpha1
    kind: MaaSModelRef
    namespace: "{{ demo_namespaces.models }}"
    name: "{{ demo_model.name }}"
  register: openshift_ai_modelref
  until: (openshift_ai_modelref.resources | first | default({})).status.phase | default('') == 'Ready'
  retries: "{{ openshift_ai_maas_resource_retries }}"
  delay: "{{ openshift_ai_maas_resource_delay }}"
  failed_when: false

- name: Report a model MaaS has not accepted
  ansible.builtin.assert:
    that: (openshift_ai_modelref.resources | first | default({})).status.phase | default('') == 'Ready'
    fail_msg: >-
      MaaS has not accepted {{ demo_model.name }} (phase
      {{ (openshift_ai_modelref.resources | first | default({})).status.phase | default('unknown') }}:
      {{ (openshift_ai_modelref.resources | first | default({})).status.conditions | default([])
         | map(attribute='message', default='') | select | join('; ') or 'no status yet' }}).
      Check it with: oc get maasmodelref {{ demo_model.name }} -n {{ demo_namespaces.models }} -o yaml
    quiet: true

# --- The enrichment service's API key ----------------------------------------------------------

# A short-lived token for the service account, from the Kubernetes TokenRequest API. MaaS accepts
# OpenShift tokens to mint keys, and a key minted with this token belongs to the service account.
- name: Get a short-lived token for the enrichment service account
  ansible.builtin.uri:
    url: >-
      {{ secrets_values.cluster_api_url | regex_replace('/$', '') }}/api/v1/namespaces/{{
      demo_namespaces.enrichment }}/serviceaccounts/{{ demo_maas_consumer.service_account }}/token
    method: POST
    headers:
      Authorization: "Bearer {{ secrets_values.cluster_api_token }}"
    body_format: json
    body:
      apiVersion: authentication.k8s.io/v1
      kind: TokenRequest
      spec:
        expirationSeconds: 600
    status_code: [200, 201]
    validate_certs: "{{ demo_cluster_validate_certs }}"
    ca_path: "{{ secrets_cluster_ca_file | default(omit) }}"
  register: openshift_ai_consumer_token
  no_log: true

- name: Read the stored API key
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ demo_namespaces.enrichment }}"
    name: "{{ openshift_ai_maas_key_secret }}"
  register: openshift_ai_stored_key
  no_log: true

- name: Check whether the stored API key still works
  ansible.builtin.uri:
    url: "{{ openshift_ai_maas_url }}/maas-api/v1/models"
    headers:
      Authorization: "Bearer {{ openshift_ai_stored_key.resources[0].data['api-key'] | b64decode }}"
    status_code: [200, 401, 403]
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_stored_key_check
  when: openshift_ai_stored_key.resources | length > 0
  failed_when: false
  no_log: true

# A network failure is not a sign of a bad key; stop rather than mint a replacement.
- name: Report a MaaS gateway that cannot be reached
  ansible.builtin.assert:
    that: openshift_ai_stored_key_check.status | default(0) != -1
    fail_msg: >-
      Cannot reach the MaaS gateway at {{ openshift_ai_maas_url }}
      ({{ openshift_ai_stored_key_check.msg | default('no response') | truncate(200) }}).
      Check that DNS resolves the name and the gateway is programmed: oc get gateway -n openshift-ingress
    quiet: true

- name: Decide whether a new key is needed
  ansible.builtin.set_fact:
    openshift_ai_mint_key: >-
      {{ openshift_ai_stored_key.resources | length == 0
         or openshift_ai_stored_key_check.status | default(0) != 200 }}

- name: Mint an API key for the enrichment service
  ansible.builtin.uri:
    url: "{{ openshift_ai_maas_url }}/maas-api/v1/api-keys"
    method: POST
    headers:
      Authorization: "Bearer {{ openshift_ai_consumer_token.json.status.token }}"
    body_format: json
    body:
      name: "{{ demo_maas_consumer.service_account }}"
      description: API key for the AIOps enrichment service
      expiresIn: "{{ demo_maas_consumer.key_expiry }}"
      subscription: "{{ demo_maas_consumer.service_account }}"
      labels:
        app: aiops-enrichment
        environment: demo
    status_code: [200, 201]
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_new_key
  when: openshift_ai_mint_key | bool
  failed_when: false
  no_log: true

# Reports the outcome without the key: only the status code and MaaS's error text.
- name: Report a key MaaS would not mint
  ansible.builtin.assert:
    that: openshift_ai_new_key.status in [200, 201]
    fail_msg: "{{ openshift_ai_mint_unreachable if openshift_ai_new_key.status | default(-1) == -1 else openshift_ai_mint_refused }}"
    quiet: true
  vars:
    openshift_ai_mint_unreachable: >-
      Cannot reach the MaaS gateway at {{ openshift_ai_maas_url }} to mint the key
      ({{ openshift_ai_new_key.msg | default('no response') | truncate(200) }}).
      Check that DNS resolves the name and the gateway is programmed: oc get gateway -n openshift-ingress
    openshift_ai_mint_refused: >-
      MaaS refused to mint the key (HTTP {{ openshift_ai_new_key.status }}:
      {{ openshift_ai_new_key.json.error | default(openshift_ai_new_key.json.message | default(openshift_ai_new_key.msg | default(''))) }}).
      Check that the subscription and policy above are active and name {{ openshift_ai_consumer_user }}.
  when: openshift_ai_mint_key | bool

# The client view of MaaS: the models this key may use, each with the ID to put in the request's
# model field and the URL to send it to. MaaS routes the shared OpenAI-style endpoint on that ID,
# so the build stores what MaaS publishes rather than assuming a name or a path.
- name: List the models MaaS offers the new key
  ansible.builtin.uri:
    url: "{{ openshift_ai_maas_url }}/maas-api/v1/models"
    headers:
      Authorization: "Bearer {{ openshift_ai_new_key.json.key }}"
    status_code: [200]
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_new_key_models
  when: openshift_ai_mint_key | bool
  failed_when: false
  no_log: true

- name: Find the model in the list
  ansible.builtin.set_fact:
    openshift_ai_offered_models: "{{ openshift_ai_model_list.json.data | default([]) }}"
    openshift_ai_published_model: >-
      {{ openshift_ai_model_list.json.data | default([])
         | selectattr('owned_by', 'equalto', demo_namespaces.models ~ '/' ~ demo_model.name) | first | default({}) }}
  vars:
    openshift_ai_model_list: "{{ openshift_ai_new_key_models if openshift_ai_mint_key | bool else openshift_ai_stored_key_check }}"

- name: Report a model MaaS does not offer the enrichment service
  ansible.builtin.assert:
    that:
      - openshift_ai_published_model.id is defined
      - openshift_ai_published_model.url is defined
      - openshift_ai_published_model.ready | default(false) | bool
    fail_msg: >-
      MaaS does not offer {{ demo_namespaces.models }}/{{ demo_model.name }} to the enrichment service's
      key{{ ' (it is listed but not ready)' if openshift_ai_published_model.id is defined else '' }}.
      It offers: {{ openshift_ai_offered_models | map(attribute='owned_by', default='?') | join(', ') or 'no models' }}.
      Check that the subscription names this model: oc get maassubscription
      {{ demo_maas_consumer.service_account }} -n {{ openshift_ai_maas_tenant_namespace }} -o yaml
    quiet: true

# Everything the enrichment service needs to call the model: the key, where to send requests and
# the model ID to put in them. Written as data rather than stringData so a rerun that changes
# nothing reports no change.
- name: Store the API key and the model's address for the enrichment service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ openshift_ai_maas_key_secret }}"
        namespace: "{{ demo_namespaces.enrichment }}"
      type: Opaque
      data:
        api-key: "{{ (openshift_ai_new_key.json.key if openshift_ai_mint_key | bool
                     else openshift_ai_stored_key.resources[0].data['api-key'] | b64decode) | b64encode }}"
        key-id: "{{ (openshift_ai_new_key.json.id if openshift_ai_mint_key | bool
                    else openshift_ai_stored_key.resources[0].data['key-id'] | default('') | b64decode) | b64encode }}"
        expires-at: "{{ (openshift_ai_new_key.json.expiresAt | default('') if openshift_ai_mint_key | bool
                        else openshift_ai_stored_key.resources[0].data['expires-at'] | default('') | b64decode) | b64encode }}"
        url: "{{ openshift_ai_published_model.url | regex_replace('/$', '') | b64encode }}"
        model: "{{ openshift_ai_published_model.id | b64encode }}"
  no_log: true

- name: Record the access result
  ansible.builtin.set_fact:
    openshift_ai_report: >-
      {{ openshift_ai_report + ['Access: model accepted by MaaS, policy and subscription active for ' ~ openshift_ai_consumer_user
           ~ ' (' ~ demo_maas_consumer.token_limit ~ ' tokens per ' ~ demo_maas_consumer.token_window ~ '); API key '
           ~ ('minted' if openshift_ai_mint_key | bool else 'kept, still valid')
           ~ ' and stored in ' ~ demo_namespaces.enrichment ~ '/' ~ openshift_ai_maas_key_secret
           ~ ' with model ID ' ~ openshift_ai_published_model.id] }}

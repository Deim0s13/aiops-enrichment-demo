---
# The M1 exit criterion, checked on every build through the public MaaS gateway, as a client would:
#   1. a request with the enrichment service's key gets an answer from the model
#   2. a request with no key is refused
#   3. a revoked key is refused: a temporary key is minted, used, revoked and tried again
# Requests that carry a key are hidden (no_log); only status codes and the model's reply are shown.

- name: Read the enrichment service's API key
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ demo_namespaces.enrichment }}"
    name: "{{ openshift_ai_maas_key_secret }}"
  register: openshift_ai_check_secret
  no_log: true

# The checks use only what the Secret holds, as the enrichment service will.
- name: Set the test request
  ansible.builtin.set_fact:
    openshift_ai_check_url: "{{ openshift_ai_check_secret.resources[0].data.url | b64decode }}/v1/chat/completions"
    openshift_ai_check_body:
      model: "{{ openshift_ai_check_secret.resources[0].data.model | b64decode }}"
      messages:
        - role: user
          content: "Reply with exactly one word: ready"
      max_tokens: 10
      temperature: 0

- name: "Check 1: call the model with the enrichment service's key"
  ansible.builtin.uri:
    url: "{{ openshift_ai_check_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ openshift_ai_check_secret.resources[0].data['api-key'] | b64decode }}"
    body_format: json
    body: "{{ openshift_ai_check_body }}"
    status_code: [200, 401, 403, 404, 429, 500, 502, 503]
    timeout: 120
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_check_with_key
  failed_when: false
  no_log: true

- name: "Check 2: call the model with no key"
  ansible.builtin.uri:
    url: "{{ openshift_ai_check_url }}"
    method: POST
    body_format: json
    body: "{{ openshift_ai_check_body }}"
    status_code: [200, 401, 403, 404]
    timeout: 30
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_check_no_key
  failed_when: false

- name: "Check 3: mint a temporary key"
  ansible.builtin.uri:
    url: "{{ openshift_ai_maas_url }}/maas-api/v1/api-keys"
    method: POST
    headers:
      Authorization: "Bearer {{ openshift_ai_consumer_token.json.status.token }}"
    body_format: json
    body:
      name: "{{ demo_maas_consumer.service_account }}-revocation-check"
      description: Temporary key for the build's revocation check
      ephemeral: true
      expiresIn: 10m
      subscription: "{{ demo_maas_consumer.service_account }}"
    status_code: [200, 201]
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_temp_key
  no_log: true

- name: "Check 3: call the model with the temporary key"
  ansible.builtin.uri:
    url: "{{ openshift_ai_check_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ openshift_ai_temp_key.json.key }}"
    body_format: json
    body: "{{ openshift_ai_check_body }}"
    status_code: [200, 401, 403, 429]
    timeout: 120
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_check_temp_before
  failed_when: false
  no_log: true

- name: "Check 3: revoke the temporary key"
  ansible.builtin.uri:
    url: "{{ openshift_ai_maas_url }}/maas-api/v1/api-keys/{{ openshift_ai_temp_key.json.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ openshift_ai_consumer_token.json.status.token }}"
    status_code: [200, 204]
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  no_log: true

# Revocation is effective once Authorino's cached validation of the key expires.
- name: "Check 3: wait until the revoked key is refused"
  ansible.builtin.uri:
    url: "{{ openshift_ai_check_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ openshift_ai_temp_key.json.key }}"
    body_format: json
    body: "{{ openshift_ai_check_body }}"
    status_code: [200, 401, 403, 404, 429]
    timeout: 120
    validate_certs: "{{ openshift_ai_maas_validate_certs }}"
  register: openshift_ai_check_temp_after
  until: openshift_ai_check_temp_after.status in [401, 403]
  retries: "{{ openshift_ai_maas_revoke_retries }}"
  delay: "{{ openshift_ai_maas_revoke_delay }}"
  failed_when: false
  no_log: true

- name: Summarise the access checks
  ansible.builtin.set_fact:
    openshift_ai_checks:
      with_key: "{{ openshift_ai_check_with_key.status | default(-1) }}"
      reply: "{{ (openshift_ai_check_with_key.json.choices | default([{}]))[0].message.content | default('') | trim | truncate(40) }}"
      no_key: "{{ openshift_ai_check_no_key.status | default(-1) }}"
      temp_before: "{{ openshift_ai_check_temp_before.status | default(-1) }}"
      temp_after: "{{ openshift_ai_check_temp_after.status | default(-1) }}"

- name: Check that governed access works as designed
  ansible.builtin.assert:
    that:
      - openshift_ai_checks.with_key | int == 200
      - openshift_ai_checks.no_key | int in [401, 403]
      - openshift_ai_checks.temp_before | int == 200
      - openshift_ai_checks.temp_after | int in [401, 403]
    fail_msg: >-
      Access checks (HTTP status): with the enrichment key {{ openshift_ai_checks.with_key }} (expected 200),
      with no key {{ openshift_ai_checks.no_key }} (expected 401 or 403), temporary key before revocation
      {{ openshift_ai_checks.temp_before }} (expected 200) and after {{ openshift_ai_checks.temp_after }}
      (expected 401 or 403). A 404 means MaaS does not route the model ID stored in the Secret; a 429 means the token
      budget is used up.
    quiet: true

- name: Record the access check results
  ansible.builtin.set_fact:
    openshift_ai_report: >-
      {{ openshift_ai_report + ['Checks: with key 200 (model replied "' ~ openshift_ai_checks.reply ~ '"), no key '
           ~ openshift_ai_checks.no_key ~ ', revoked key ' ~ openshift_ai_checks.temp_after] }}

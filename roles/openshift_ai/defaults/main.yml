---
# The AI platform for phase 02. The operators to check or install, the model namespaces allowed on
# the MaaS gateway and the database connection are inputs (meta/argument_specs.yml).

# Kuadrant is the policy layer of Red Hat Connectivity Link. MaaS uses it, through Authorino and
# Limitador, to check API keys and enforce token rate limits at the gateway (DD14).
openshift_ai_kuadrant_namespace: kuadrant-system
# Connectivity Link installs Authorino at one exact version. A standalone Authorino the environment
# ships is removed before Connectivity Link is installed when this is true (authorino.yml).
openshift_ai_authorino_package: authorino-operator
openshift_ai_replace_standalone_authorino: false
openshift_ai_kuadrant_api_version: kuadrant.io/v1beta1
openshift_ai_kuadrant_ready_retries: 30
openshift_ai_kuadrant_ready_delay: 10

# Models-as-a-Service (DD14). The gateway name, namespace and annotations are fixed by MaaS.
openshift_ai_maas_gateway_name: maas-default-gateway
openshift_ai_maas_gateway_class: openshift-default
# The gateway answers on <prefix>.<apps domain>, which the environment's trusted *.apps
# certificate covers. OpenShift creates the DNS record for a gateway hostname.
openshift_ai_maas_hostname_prefix: maas
# MaaS reads its database connection from maas-db-config in this namespace (the 3.5 default).
openshift_ai_maas_infra_namespace: redhat-ai-gateway-infra
openshift_ai_maas_ready_retries: 60
openshift_ai_maas_ready_delay: 10

# MLflow (DD07). One server per cluster, run by the operator in this namespace. Metadata goes to the
# shared PostgreSQL; artifacts go to a volume, because the environment has no S3-compatible storage.
openshift_ai_mlflow_namespace: redhat-ods-applications
openshift_ai_mlflow_storage_size: 10Gi
openshift_ai_mlflow_ready_retries: 60
openshift_ai_mlflow_ready_delay: 10

---
# Install once with: pre-commit install
# Refresh pinned versions with: pre-commit autoupdate
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.9.0
    hooks:
      - id: ansible-lint

  - repo: local
    hooks:
      # Blocks any debug task that references secrets_values, the fact holding every resolved
      # secret (roles/secrets). Asserts and when: conditions are not affected.
      - id: no-debug-secrets-values
        name: Block debug tasks that print secrets_values
        language: pygrep
        entry: '^([ \t]*)(?:-[ \t]+)?(?:ansible\.builtin\.)?debug:[^\n]*(?:\n\1[ \t]+[^\n]*)*?secrets_values'
        args: [--multiline]
        types: [yaml]
        exclude: ^\.pre-commit-config\.yaml$

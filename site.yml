---
# Full build of a fresh demo environment. Run one phase with --tags <phase>.
# playbooks/00_secrets.yml and playbooks/05_execution_environment.yml are not included: they run on
# the laptop with ansible-playbook, outside the execution environment. Run the second before AAP content.

- name: Preflight
  ansible.builtin.import_playbook: playbooks/00_preflight.yml

- name: Platform
  ansible.builtin.import_playbook: playbooks/01_platform.yml

- name: OpenShift AI
  ansible.builtin.import_playbook: playbooks/02_openshift_ai.yml

- name: Ansible Automation Platform
  ansible.builtin.import_playbook: playbooks/03_aap.yml

- name: ServiceNow
  ansible.builtin.import_playbook: playbooks/04_servicenow.yml

- name: AAP content
  ansible.builtin.import_playbook: playbooks/05_aap_content.yml

- name: Workload
  ansible.builtin.import_playbook: playbooks/06_workload.yml

- name: Knowledge
  ansible.builtin.import_playbook: playbooks/07_knowledge.yml

- name: Enrichment service
  ansible.builtin.import_playbook: playbooks/08_enrichment.yml

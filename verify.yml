---
# The M2 acceptance checks (design section 9), run any time after a build:
#   ansible-navigator run verify.yml
# Raises incidents as svc-monitoring and reads the outcome back from ServiceNow. V5 stops the
# enrichment service for a minute or two and always starts it again: do not run it mid-demo.
# The incidents are kept for review, and reset.yml closes them; -e verify_cleanup=true deletes them.

- name: Verify the demo against its acceptance criteria
  hosts: localhost
  gather_facts: false
  tags: [verify]

  # See playbooks/01_platform.yml for why the modules are listed one by one.
  module_defaults:
    kubernetes.core.k8s: &cluster_auth
      host: "{{ secrets_values.cluster_api_url }}"
      api_key: "{{ secrets_values.cluster_api_token }}"
      validate_certs: "{{ demo_cluster_validate_certs }}"
      ca_cert: "{{ secrets_cluster_ca_file | default(omit) }}"
    kubernetes.core.k8s_info: *cluster_auth

  tasks:
    - name: Resolve the cluster and ServiceNow secrets
      ansible.builtin.include_role:
        name: secrets
      vars:
        secrets_groups: [cluster, servicenow]

    - name: Run the checks
      ansible.builtin.include_role:
        name: verify
      vars:
        verify_assignment_group: "{{ demo_servicenow.assignment_group }}"
        verify_category: "{{ demo_servicenow.category }}"
        verify_aap_namespace: "{{ demo_namespaces.aap }}"
        verify_enrichment_namespace: "{{ demo_namespaces.enrichment }}"

---
# Environment settings for the demo. No secrets belong in this file (see SECURITY.md).

demo_name: aiops-enrichment-demo

# Platform baseline (docs/implementation-design.md, header and section 7)
demo_versions:
  openshift_ai: "3.5"
  aap: "2.7"

# Operators the build checks or installs (DD13). Channels are pinned and patch releases are picked
# up automatically; each phase reports the exact versions it found. Operators the environment
# already provides are left on their own channel, and only min_version is enforced.
demo_operators:
  openshift_ai: { package: rhods-operator, channel: stable-3.x, min_version: "3.5.0" }
  connectivity_link: { package: rhcl-operator, channel: stable, min_version: "1.4.0" }
  # Namespace-scoped channel: the operator watches only its own namespace (demo_namespaces.aap).
  aap: { package: ansible-automation-platform-operator, channel: stable-2.7, min_version: "2.7.0" }

# Instance profile drives resource requests. Change to g6.12xlarge for four L4 GPUs.
demo_instance_profile: g6.16xlarge

# Incident family for the demo scenarios (DD01). Each family is a content set:
# diagnostic jobs in automation/diagnostics and documents in knowledge/.
demo_incident_family: jvm-memory

demo_namespaces:
  workload: demo-payments
  enrichment: aiops-enrichment
  models: aiops-models
  data: aiops-data
  aap: aap

# The repository AAP syncs as its project (phase 07, DD16). Private, so AAP reads it with a
# fine-grained, read-only token from Vault (source/github_token).
demo_repository:
  url: https://github.com/Deim0s13/aiops-enrichment-demo.git
  owner: Deim0s13
  name: aiops-enrichment-demo
  branch: main

# The AAP organisation that owns the demo's content (phase 07). The rulebook names it too.
demo_aap_organisation: ACME Bank
# Decision environment for the rulebook activation: Red Hat's supported image for AAP 2.7, pinned by tag
# (DD12). The AAP 2.7 operator sets up none. Empty: reuse one already defined in EDA.
demo_aap_decision_environment: registry.redhat.io/ansible-automation-platform-27/de-supported-rhel9:1.3.2-1790933984

# The execution environment AAP runs the demo's automation in: the image built on the laptop,
# published to the cluster's internal registry by playbooks/07_execution_environment.yml (DD17).
demo_execution_environment:
  # Built for linux/amd64, the cluster's architecture (laptop-setup step 4); :latest is the laptop's own.
  local_image: localhost/aiops-demo-ee:amd64
  architecture: amd64
  name: aiops-demo-ee

# ServiceNow (phase 04). The trigger matches incidents in this group and category (design section 5.1).
demo_servicenow:
  assignment_group: ACME Payments On-call
  category: software

# The service map (design 5.2): each configuration item the diagnostics may look at, and where it
# runs. Phase 04 creates the configuration items in ServiceNow, the integration stand-in sets them on
# its incidents, and phase 07 gives the map to the diagnostic job templates. An incident whose
# configuration item is not here gets no diagnostics, whatever its text says.
demo_service_map:
  payments-notify:
    description: ACME Bank payments notification service (the demo's sample workload)
    namespace: "{{ demo_namespaces.workload }}"
    app: payments-notify
    container: payments-notify

# The level 2 catalogue (design 5.3): the only jobs enrichment may recommend, each for the configuration
# items it applies to. The model selection evaluated with the same three. The jobs themselves arrive in
# M5; until then a recommendation is advice only, and nothing is launched.
demo_enrichment_catalogue:
  - id: payments-heapdump-restart
    services: [payments-notify]
    description: >-
      Capture a heap dump from one payments-notify pod to the support volume, then restart that pod.
      Use when the JVM heap is exhausted, to preserve evidence before recovery.
  - id: payments-scale-out
    services: [payments-notify]
    description: >-
      Add one replica to payments-notify, up to a maximum of six. Use to absorb load while a cause is
      investigated.
  - id: payments-db-failover
    services: [payments-notify]
    description: >-
      Fail the payments database over to its standby. High risk: interrupts every payments service for
      up to two minutes. Use only for a confirmed primary database failure.

# Container images (DD12). Pinned; the build never pulls latest.
demo_images:
  postgresql: registry.redhat.io/rhel9/postgresql-16:1791897894

# Shared PostgreSQL (DD06). Each database gets its own user and generated password.
# The knowledge index database is added in phase 08.
demo_postgres_databases:
  - maas
  - mlflow

# GPU freeing in phase 01 (DD13). The RHDP OpenShift AI environment ships a sample model that
# holds the only GPU. Namespaces listed here are deleted if they hold it; any other holder
# stops the build. Set demo_free_gpu to false to never delete anything.
demo_free_gpu: true
demo_gpu_reclaimable_namespaces:
  - my-first-model

# Authorino in phase 02 (DD13). Some RHDP environments ship the Authorino operator on its own, at a
# version Connectivity Link does not accept. When true, phase 02 removes it before installing
# Connectivity Link, which then installs the version it requires. When false, phase 02 stops and
# says how to remove it.
demo_replace_standalone_authorino: true

# Trigger mode from ServiceNow to EDA (DD03): push or poll. OI01 is closed: the environment's
# routes are reachable from the internet with a publicly trusted certificate, so push.
demo_trigger_mode: push

# The model (DD04), chosen by the model selection test (OI04, docs/model-selection.md) for
# engineer-reviewed enrichment only. Changing it and rerunning phase 02 replaces the model served;
# the candidates tested are in evaluation/model_selection/settings.yml.
# The name is used for the LLMInferenceService and its MaaS entry. Consumers read the model ID MaaS
# publishes for it from their Secret.
demo_model:
  name: qwen3-8b
  display_name: Qwen3 8B (FP8)
  modelcar_image: oci://registry.redhat.io/rhelai1/modelcar-qwen3-8b-fp8-dynamic:1.5
  # Fits the L4's memory with room for the KV cache; enrichment prompts are well under this.
  max_model_len: 16384
  # Added to every request: Qwen3's thinking mode is slow on an L4, and enrichment needs a direct answer.
  request_extra:
    chat_template_kwargs:
      enable_thinking: false

# Governed model access for the enrichment service (DD14, ADR06). The enrichment service calls the
# model as its own service account, through a MaaS subscription with a token budget.
demo_maas_consumer:
  service_account: aiops-enrichment
  token_limit: 100000
  token_window: 1h
  # Long enough for an environment's life; a rebuild mints a new key.
  key_expiry: 30d

# Secrets backend (SECURITY.md): vault or local
demo_secrets_backend: vault
# Vault address as seen from inside the execution environment. On macOS, Podman resolves
# host.containers.internal to the laptop. Override with the AIOPS_VAULT_ADDR environment variable.
demo_vault_addr: "{{ lookup('ansible.builtin.env', 'AIOPS_VAULT_ADDR', default='http://host.containers.internal:8200') }}"
demo_vault_mount: aiops-demo
# Path to the local secrets file as seen from inside the execution environment (see docs/laptop-setup.md).
demo_local_secrets_file: /runner/aiops-secrets/secrets.yml

# The cluster API certificate is always verified: against the cluster's own CA when
# aiops-demo/cluster holds api_ca_cert (RHDP environments need this, see docs/build-guide.md),
# otherwise against the execution environment's trusted CAs. Set to false only as a last resort:
# the cluster token would then be sent to a server that has not been verified.
demo_cluster_validate_certs: true

# Logical secret names mapped to Vault paths and keys. Preflight checks that every entry is set,
# except those marked optional. api_ca_cert is not a secret, but it changes with each environment.
demo_required_secrets:
  pull_secret: { path: entitlements, key: pull_secret }
  aap_manifest_b64: { path: entitlements, key: aap_manifest_b64 }
  automation_hub_token: { path: entitlements, key: automation_hub_token }
  registry_username: { path: entitlements, key: registry_username }
  registry_password: { path: entitlements, key: registry_password }
  cluster_api_url: { path: cluster, key: api_url }
  cluster_api_token: { path: cluster, key: api_token }
  cluster_api_ca_cert: { path: cluster, key: api_ca_cert, optional: true }
  servicenow_instance_url: { path: servicenow, key: instance_url }
  servicenow_admin_username: { path: servicenow, key: admin_username }
  servicenow_admin_password: { path: servicenow, key: admin_password }
  github_token: { path: source, key: github_token }

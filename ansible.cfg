[defaults]
inventory = inventory/hosts.yml
# Setting this replaces Ansible's default search path, so it must include the execution
# environment's collection directory (/usr/share/ansible/collections) as well as the repository's
# own collections and the laptop's.
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
roles_path = ./roles
interpreter_python = auto_silent
retry_files_enabled = false
callback_result_format = yaml

[galaxy]
# Certified collections come from Automation Hub. Supply the token at run time with
# ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN; never write it here.
server_list = automation_hub, galaxy

[galaxy_server.automation_hub]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token

[galaxy_server.galaxy]
url = https://galaxy.ansible.com/

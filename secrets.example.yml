---
# Template for the local secrets backend (demo_secrets_backend: local).
#
# Do not fill this file in. Copy it outside the repository first:
#   mkdir -p ~/.config/aiops-demo
#   cp secrets.example.yml ~/.config/aiops-demo/secrets.yml
#   ansible-vault encrypt ~/.config/aiops-demo/secrets.yml
#
# With the Vault backend, store the same keys at the paths in SECURITY.md instead.

entitlements:
  pull_secret: "REPLACE_WITH_PULL_SECRET_JSON"
  aap_manifest_b64: "REPLACE_WITH_BASE64_ENCODED_MANIFEST_ZIP"
  automation_hub_token: "REPLACE_WITH_AUTOMATION_HUB_OFFLINE_TOKEN"
  registry_username: "REPLACE_WITH_REGISTRY_USERNAME"
  registry_password: "REPLACE_WITH_REGISTRY_PASSWORD"

cluster:
  api_url: "https://api.REPLACE_WITH_CLUSTER_DOMAIN:6443"
  api_token: "REPLACE_WITH_CLUSTER_TOKEN"
  # Optional: the cluster's CA bundle, needed when the API certificate is not publicly trusted.
  # api_ca_cert: |
  #   -----BEGIN CERTIFICATE-----
  #   ...

source:
  github_token: "REPLACE_WITH_FINE_GRAINED_READ_ONLY_TOKEN"

servicenow:
  instance_url: "https://REPLACE_WITH_INSTANCE.service-now.com"
  admin_username: "REPLACE_WITH_ADMIN_USERNAME"
  admin_password: "REPLACE_WITH_ADMIN_PASSWORD"

---
# Diagnostic (flow step 3, design 5.2): recent changes. Read-only, as the aiops-diagnostics service account,
# through the job's time-limited cluster credential (DD20). Vars from the workflow: cmdb_ci. From the
# job template: diagnostics_service_map. Publishes diagnostics_evidence_changes for the work note step.
- name: "AI enrichment | Diagnostics: recent changes"
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Run the diagnostic and publish its evidence
      ansible.builtin.include_role:
        name: demo.aiops.evidence
      vars:
        evidence_diagnostic: changes
        evidence_cmdb_ci: "{{ cmdb_ci | default('') | string }}"
        evidence_service_map: "{{ diagnostics_service_map }}"

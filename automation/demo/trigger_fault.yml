---
# Demo control, not part of the enrichment path: starts a payments-notify fault (DD01, DD25).
#   single     the notification template cache grows until the container is OOMKilled once; it
#              restarts clean.
#   recurring  as single, but the fault resumes after every restart, until reset.yml replaces the pod
#              or an engineer clears it.
#   throttling MessageHub refuses deliveries with HTTP 429 and confirmations queue (scenario S2). No
#              runbook covers it. It lasts about 15 minutes, or until reset.yml or an engineer clears it.
# Run reset.yml between scenarios, so one fault's restarts and log are not in the next one's evidence.
# Vars: fault_scenario (survey), fault_service_url (set on the job template by phase 07).
- name: "Demo | Trigger a payments-notify fault"
  hosts: localhost
  gather_facts: false
  vars:
    fault_scenario: single
  tasks:
    - name: Check the scenario
      ansible.builtin.assert:
        that: fault_scenario in ['single', 'recurring', 'throttling']
        fail_msg: "fault_scenario must be single, recurring or throttling, not {{ fault_scenario }}."
        quiet: true

    - name: Start the fault
      ansible.builtin.uri:
        url: "{{ fault_service_url }}/fault?scenario={{ fault_scenario }}"
        method: POST
        status_code: [202]
        timeout: 15

    - name: Say what happens next
      ansible.builtin.debug:
        msg: >-
          {% if fault_scenario == 'throttling' %}
          The throttling fault has started. MessageHub refuses payments-notify's deliveries with HTTP 429, and customer
          confirmations queue; the backlog alert raises its incident in a minute or two. No runbook covers this fault.
          {% else %}
          The {{ fault_scenario }} fault has started. payments-notify's heap grows for a few minutes, then the
          container is OOMKilled{{ ' and restarts clean' if fault_scenario == 'single'
          else ', and the fault resumes after every restart until it is cleared' }}. The alerts raise the incident.
          {% endif %}
